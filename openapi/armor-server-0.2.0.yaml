openapi: 3.1.0
info:
  title: A.R.M.O.R. Server API
  version: 0.1.7
  description: >-
    The HTTP surface of ARMOR-SERVER. Message bodies reference the JSON Schemas
    published in src/armor_common/schemas, which are the single source of truth.
    Every route that configures, moves, captures, records, protects or deletes
    needs an operator (a Studio session cookie, an operator session or the
    operator bearer token).
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Liveness, no credentials
      responses:
        '200': { description: Service ready }
  /api/v1/status:
    get:
      summary: Read-only system projection (operator)
      responses:
        '200':
          description: Mode, revision and every node with its stale/offline state
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemState' } } }
        '401': { description: Operator authorization is required }
  /api/v1/info:
    get:
      summary: Server version and uptime; the mode and enabled capabilities only for an operator
      responses:
        '200': { description: Server information }
  /api/v1/telemetry:
    post:
      summary: Field-node telemetry
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/telemetry.schema.json' } } } }
      responses:
        '202': { description: Accepted }
        '400': { description: Invalid payload }
        '401': { description: Authentication failure }
  /api/v1/solar:
    get:
      summary: The latest reading of every solar inverter and battery stack that a gateway node reports, with whether each is stale, and the sums Studio shows
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ devices: [{ node_id, device, kind, reading, received_at, stale, example, registered? }], waiting: [declared devices with no reading yet], totals, catalog: { inverter_models, battery_models, connections } }' }
        '401': { description: Operator authorization is required }
    post:
      summary: A solar message over HTTP (an ingest token); the same payloads as armor/solar/{node_id}/{device}/state
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { oneOf: [ { $ref: '../src/armor_common/schemas/solar_inverter.schema.json' }, { $ref: '../src/armor_common/schemas/solar_battery.schema.json' } ] } } } }
      responses:
        '202': { description: Accepted }
        '400': { description: Invalid payload }
        '401': { description: Authentication failure }
  /api/v1/solar/devices:
    post:
      summary: Declare a solar inverter or battery stack (name, model, connection, gateway node), or change the one with the same node and device; it shows as waiting until its gateway node reports
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, name, node_id], properties: { kind: { type: string, enum: [inverter, battery] }, name: { type: string, maxLength: 60 }, node_id: { type: string }, device: { type: string, description: Taken from the name when omitted }, model: { type: string }, connection: { type: string, enum: [rs232, rs485, usb, can, wifi, other] }, notes: { type: string, maxLength: 200 } } } } } }
      responses:
        '200': { description: Changed }
        '201': { description: Declared }
        '400': { description: Invalid input }
        '401': { description: Operator authorization is required }
        '409': { description: The node and device exist with another kind, or there are too many devices }
  /api/v1/solar/devices/{node}/{device}:
    delete:
      summary: Forget a declared solar device and its readings
      security: [{ operator: [] }]
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }, { name: device, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed }
        '400': { description: Invalid node or device }
        '401': { description: Operator authorization is required }
        '404': { description: Unknown solar device }
  /api/v1/solar/devices/{node}/{device}/example:
    post:
      summary: One made-up reading of a declared device, marked as an example, to try the menus before a gateway node reports
      security: [{ operator: [] }]
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }, { name: device, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: Accepted }
        '401': { description: Operator authorization is required }
        '404': { description: The device was not declared }
  /api/v1/solar/history:
    get:
      summary: The recent history of one solar device, a few numbers per sample, oldest first
      security: [{ operator: [] }]
      parameters:
        - { name: node, in: query, required: true, schema: { type: string } }
        - { name: device, in: query, required: true, schema: { type: string } }
        - { name: minutes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440 } }
      responses:
        '200': { description: '{ node_id, device, kind, samples: [{ t, ... }] }' }
        '400': { description: Missing or invalid node or device }
        '401': { description: Operator authorization is required }
  /api/v1/health:
    post:
      summary: Field-node health
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/health.schema.json' } } } }
      responses:
        '202': { description: Accepted }
        '400': { description: Invalid payload }
        '401': { description: Authentication failure }
  /api/v1/control/{mode}:
    post:
      summary: Arm or disarm
      security: [{ controlBearer: [] }]
      parameters: [{ name: mode, in: path, required: true, schema: { type: string, enum: [arm, disarm] } }]
      responses:
        '200': { description: New system state }
        '401': { description: Authentication failure }
        '404': { description: Unknown mode }
  /api/v1/studio/session:
    get:
      summary: Is the Studio session cookie valid
      responses:
        '200': { description: '{ "authenticated": boolean, "user": { id, username, role } when signed in }' }
    post:
      summary: Sign in (rate limited); sets an HttpOnly, SameSite=Strict cookie
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/StudioLogin' } } } }
      responses:
        '201': { description: Session opened }
        '401': { description: Wrong credentials }
        '429': { description: Too many attempts }
    delete:
      summary: Sign out
      responses:
        '204': { description: Session closed }
  /api/v1/users:
    get:
      summary: Studio users (an administrator only); never a password or a hash
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ users: [{ id, username, role, createdAt, updatedAt, current }], minPasswordLength }' }
        '401': { description: Not signed in }
        '403': { description: Not an administrator }
    post:
      summary: Create a Studio user (an administrator only)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NewUser' } } } }
      responses:
        '201': { description: The new user }
        '400': { description: Invalid user name, password or role }
        '409': { description: User name already in use, or too many users }
  /api/v1/users/{id}:
    patch:
      summary: Rename a user, set a new password or change the role (an administrator only). The user's other sessions end when the password or role changes.
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UserChange' } } } }
      responses:
        '200': { description: The user }
        '400': { description: Invalid value }
        '404': { description: Unknown user }
        '409': { description: Name taken, or it would leave no administrator }
    delete:
      summary: Delete a user (an administrator only; never yourself or the last administrator)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown user }
        '409': { description: Yourself, or the last administrator }
  /api/v1/account:
    patch:
      summary: Change your own user name and password; the current password is required (rate limited)
      security: [{ studio: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AccountChange' } } } }
      responses:
        '200': { description: 'Your user { id, username, role }' }
        '400': { description: Invalid value, or nothing to change }
        '401': { description: Not signed in }
        '403': { description: The current password is wrong }
  /api/v1/mode:
    post:
      summary: Arm or disarm the system from Studio (an operator); the answer is the new state of the perimeter
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [mode], properties: { mode: { type: string, enum: [armed, disarmed] } } } } } }
      responses:
        '200': { description: The new state }
        '400': { description: Unknown mode }
  /api/v1/devices:
    get:
      summary: The devices (sensors and actuators other than the radars and cameras), with the kinds and protocols A.R.M.O.R. knows; a command URL is never included
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ devices, kinds, protocols }' }
    post:
      summary: Register a device
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceInput' } } } }
      responses:
        '201': { description: The device }
        '400': { description: Invalid kind, name, topic or URL }
        '409': { description: Id already in use, or too many devices }
  /api/v1/devices/state:
    post:
      summary: A device reports its state (an ingest token)
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [device_id, state], properties: { device_id: { type: string }, state: { $ref: '#/components/schemas/DeviceState' } } } } } }
      responses:
        '202': { description: Accepted }
        '400': { description: No valid field in the report }
        '401': { description: Authentication failure }
        '404': { description: Unknown device }
  /api/v1/devices/{id}:
    patch:
      summary: Change a device
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceInput' } } } }
      responses:
        '200': { description: The device }
        '404': { description: Unknown device }
    delete:
      summary: Remove a device
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed }
        '404': { description: Unknown device }
  /api/v1/devices/{id}/command:
    post:
      summary: Switch an actuator on or off, or toggle it (rate limited); over MQTT or over HTTP on the local network
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [command], properties: { command: { type: string, enum: [on, off, toggle] } } } } } }
      responses:
        '200': { description: '{ ok, via, command, device }' }
        '400': { description: The kind does not take that command }
        '404': { description: Unknown device }
        '409': { description: No command channel, or the device refused }
  /api/v1/devices/{id}/state:
    post:
      summary: Set a device's state by hand, to try an alarm or an automation; audited
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [state], properties: { state: { $ref: '#/components/schemas/DeviceState' } } } } } }
      responses:
        '200': { description: The device }
        '400': { description: No valid field }
        '404': { description: Unknown device }
  /api/v1/alarms:
    get:
      summary: Alarms - those that need a person (active) and the closed record (recent)
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ active, recent }' }
    delete:
      summary: Delete the closed record (an administrator only)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ deleted }' }
  /api/v1/alarms/acknowledge:
    post:
      summary: Acknowledge every alarm
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ acknowledged }' }
  /api/v1/alarms/{id}/acknowledge:
    post:
      summary: Acknowledge one alarm
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The alarm }
        '404': { description: Unknown alarm }
  /api/v1/automations:
    get:
      summary: The automations
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ automations }' }
    post:
      summary: Create an automation (a trigger, an optional mode, and up to six actions)
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationInput' } } } }
      responses:
        '201': { description: The automation }
        '400': { description: Invalid trigger or actions }
        '409': { description: Too many automations }
  /api/v1/automations/{id}:
    patch:
      summary: Change an automation
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationInput' } } } }
      responses:
        '200': { description: The automation }
        '404': { description: Unknown automation }
    delete:
      summary: Delete an automation
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown automation }
  /api/v1/automations/{id}/run:
    post:
      summary: Run an automation now, to try it; audited, and subject to its rate limit
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Ran }
        '404': { description: Unknown automation }
  /api/v1/site:
    get:
      summary: The site design kept on the server ({ revision, updated_at, updated_by, site })
      security: [{ operator: [] }]
      responses:
        '200': { description: The design, or revision 0 with a null site when none has been saved }
    put:
      summary: Save the site design; `revision` must be the one last read, or the save is refused with the current design (up to 768 kB)
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [revision, site], properties: { revision: { type: integer }, site: { type: object } } } } } }
      responses:
        '200': { description: '{ revision, updated_at, updated_by }' }
        '400': { description: The site is not an object, or too large }
        '409': { description: Someone else saved first; the answer carries `current` }
  /api/v1/electrical/design:
    get:
      summary: The electrical design (the house's electrical diagram) kept on the server ({ revision, updated_at, updated_by, electrical })
      security: [{ operator: [] }]
      responses:
        '200': { description: The design, or revision 0 with a null electrical when none has been saved }
    put:
      summary: Save the electrical design; `revision` must be the one last read, or the save is refused with the current design (up to 768 kB). Kept apart from the site design.
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [revision, electrical], properties: { revision: { type: integer }, electrical: { type: object } } } } } }
      responses:
        '200': { description: '{ revision, updated_at, updated_by }' }
        '400': { description: The design is not an object, or too large }
        '409': { description: Someone else saved first; the answer carries `current` }
  /api/v1/system:
    get:
      summary: What the server is and how full it is - version, uptime, mode, counts of nodes, cameras, devices, alarms, automations, users and events, and the space media and the disk use
      security: [{ operator: [] }]
      responses:
        '200': { description: The system summary }
  /api/v1/audit:
    get:
      summary: The audit trail, newest first (an administrator only); credentials are scrubbed as it is written
      security: [{ admin: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }]
      responses:
        '200': { description: '{ entries }' }
        '403': { description: Not an administrator }
  /api/v1/operator/session:
    post:
      summary: Exchange the operator token for a session cookie
      security: [{ operatorBearer: [] }]
      responses:
        '201': { description: Session opened }
        '401': { description: Authentication failure }
    delete:
      summary: Close the operator session
      security: [{ operator: [] }]
      responses:
        '204': { description: Session closed }
  /api/v1/camera-views:
    get:
      summary: Cameras without username or credentials
      responses:
        '200': { description: Camera views }
  /api/v1/cameras:
    get:
      summary: Cameras with username and credential flags (never the password)
      security: [{ operator: [] }]
      responses:
        '200': { description: Cameras }
        '401': { description: Operator required }
  /api/v1/cameras/configure:
    post:
      summary: Create or update a camera connection
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CameraInput' } } } }
      responses:
        '200': { description: Stored camera }
        '400': { description: Invalid configuration }
        '401': { description: Operator required }
  /api/v1/cameras/discover:
    post:
      summary: Probe one private /24 for camera services (one scan at a time)
      security: [{ operator: [] }]
      responses:
        '200': { description: Discovered hosts and the networks scanned }
        '429': { description: A discovery is already running }
  /api/v1/cameras/{id}:
    delete:
      summary: Remove a camera connection (evidence is kept)
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '204': { description: Removed }
        '404': { description: Unknown camera }
        '409': { description: A recording is active }
  /api/v1/cameras/{id}/ptz:
    post:
      description: A move is continuous on most cameras, so the server stops it by itself about 2.5 s after the last move; a client holding a button repeats the move every second and sends `stop` on release. The error says why a move failed (login refused, camera silent, no PTZ support).
      summary: Bounded PTZ movement (Hi3510, PSIA, then ONVIF)
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PtzCommand' } } } }
      responses:
        '200': { description: Command sent }
        '502': { description: Camera refused or is unreachable }
  /api/v1/cameras/{id}/discover-rtsp:
    post:
      summary: Test common RTSP paths with authenticated DESCRIBE
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '200': { description: Paths that answered 200 }
        '409': { description: Credentials are incomplete }
  /api/v1/cameras/{id}/stream-ticket:
    post:
      summary: Issue a five-minute stream ticket bound to this camera
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '201': { description: Stream path with ticket }
  /api/v1/cameras/{id}/mjpeg:
    get:
      summary: Live MJPEG (needs an operator or a ticket for this camera)
      parameters:
        - $ref: '#/components/parameters/CameraId'
        - { name: ticket, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: multipart/x-mixed-replace stream }
        '401': { description: Neither an operator nor a valid ticket }
        '503': { description: FFmpeg not configured or relay capacity exhausted }
  /api/v1/cameras/{id}/snapshot:
    post:
      summary: Capture a JPEG
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '201': { description: Evidence item }
        '502': { description: Capture failed }
  /api/v1/cameras/{id}/recordings/start:
    post:
      summary: Start an MP4 recording
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '202': { description: Recording started }
        '502': { description: Could not start }
  /api/v1/cameras/{id}/recordings/stop:
    post:
      summary: Stop and finalize the recording
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '200': { description: Finished evidence item }
        '409': { description: Not recording }
  /api/v1/media:
    get:
      summary: Evidence catalogue, newest first
      security: [{ operator: [] }]
      responses:
        '200': { description: Items and the cameras currently recording }
    delete:
      summary: Delete every unprotected item of a kind
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind], properties: { kind: { type: string, enum: [snapshot, recording, all] } } } } } }
      responses:
        '200': { description: Number deleted }
        '400': { description: Unknown kind }
  /api/v1/media/{cameraId}/{kind}/{file}:
    parameters: [{ $ref: '#/components/parameters/MediaPath' }]
    get:
      summary: Download or play one item
      security: [{ operator: [] }]
      responses: { '200': { description: image/jpeg or video/mp4 }, '404': { description: Not found } }
    delete:
      summary: Delete one item (refused while protected)
      security: [{ operator: [] }]
      responses: { '204': { description: Deleted }, '409': { description: Protected }, '404': { description: Not found } }
  /api/v1/media/{cameraId}/{kind}/{file}/sha256:
    parameters: [{ $ref: '#/components/parameters/MediaPath' }]
    get:
      summary: SHA-256 of the file as stored, for chain of custody
      security: [{ operator: [] }]
      responses: { '200': { description: '{ "sha256": hex }' }, '404': { description: Not found } }
  /api/v1/media/{cameraId}/{kind}/{file}/protected:
    parameters: [{ $ref: '#/components/parameters/MediaPath' }]
    put:
      summary: Protect or unprotect an item from automatic pruning
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [protected], properties: { protected: { type: boolean } } } } } }
      responses: { '204': { description: Updated }, '400': { description: protected must be a boolean }, '404': { description: Not found } }
  /api/v1/history:
    get:
      summary: Event history, newest first (operator)
      description: Alert-level, node-status and security-mode changes. `before` is an event id; use `next_before` to page.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - { name: type, in: query, schema: { type: string, enum: [alert, node, camera, mode] } }
        - { name: node, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,80}$' }, description: Node or camera id }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Case-insensitive part of the node or camera id }
        - { name: level, in: query, schema: { type: string, enum: [normal, review, high] }, description: Alerts that moved to this level }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: A page of events }
        '400': { description: Invalid filter }
        '401': { description: Operator authorization is required }
  /api/v1/nodes/{id}:
    delete:
      summary: Forget a decommissioned node (operator, audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }
      responses:
        '204': { description: Node removed }
        '400': { description: Invalid node id }
        '401': { description: Operator authorization is required }
        '404': { description: Unknown node }
  /api/v1/camera-status:
    get:
      summary: Reachability of every configured camera (operator)
      description: Seen by the watchdog with a plain TCP probe of the RTSP and ONVIF ports; a camera is offline after consecutive failed checks.
      responses:
        '200': { description: Status, time since it changed and consecutive failures per camera }
        '401': { description: Operator authorization is required }
    delete:
      summary: Permanently remove history (operator, audited)
      description: Needs `confirm=delete`. `scope=all` removes every event (optionally only one `type`); `scope=older-than` removes those older than `days`.
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string, enum: [delete] } }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [all, older-than] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 3650 } }
        - { name: type, in: query, schema: { type: string, enum: [alert, node, camera, mode] } }
      responses:
        '200': { description: How many events were removed and how many remain }
        '400': { description: Missing confirmation or invalid scope }
        '401': { description: Operator authorization is required }
  /api/v1/history/summary:
    get:
      summary: Counts of the events held and of the last 24 hours (operator)
      responses:
        '200': { description: Total, by type, oldest and newest time, and last-24-hour counters }
        '401': { description: Operator authorization is required }
  /api/v1/rules:
    get:
      summary: Alert rules (operator)
      responses:
        '200':
          description: Dwell time and ignore zones
          content: { application/json: { schema: { $ref: '#/components/schemas/Rules' } } }
        '401': { description: Operator authorization is required }
    put:
      summary: Replace the alert rules (operator, audited)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Rules' } } } }
      responses:
        '200': { description: Rules saved }
        '400': { description: Invalid rules }
        '401': { description: Operator authorization is required }
components:
  securitySchemes:
    ingestBearer: { type: http, scheme: bearer, description: ARMOR_INGEST_TOKEN }
    controlBearer: { type: http, scheme: bearer, description: ARMOR_CONTROL_TOKEN }
    operatorBearer: { type: http, scheme: bearer, description: ARMOR_OPERATOR_TOKEN }
    operator: { type: apiKey, in: cookie, name: armor_studio_session, description: Studio session, operator session or operator bearer token }
    studio: { type: apiKey, in: cookie, name: armor_studio_session, description: A signed-in Studio user }
    admin: { type: apiKey, in: cookie, name: armor_studio_session, description: A signed-in Studio user with the admin role (bearer tokens do not qualify) }
  parameters:
    CameraId: { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]{3,80}$' } }
    MediaPath:
      name: cameraId
      in: path
      required: true
      description: Also takes {kind} (snapshots or recordings) and {file}
      schema: { type: string }
  schemas:
    DeviceState:
      type: object
      description: 'Canonical fields only; anything else is dropped. Booleans: triggered, open, on, locked, tamper. Numbers: temperature, humidity, battery, brightness, power_w, energy_kwh, lux, rssi, co_ppm.'
      additionalProperties: false
      properties:
        triggered: { type: boolean }
        open: { type: boolean }
        on: { type: boolean }
        locked: { type: boolean }
        tamper: { type: boolean }
        temperature: { type: number }
        humidity: { type: number }
        battery: { type: number }
        brightness: { type: number }
        power_w: { type: number }
        energy_kwh: { type: number }
        lux: { type: number }
        rssi: { type: number }
        co_ppm: { type: number }
    DeviceInput:
      type: object
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [smoke, co, gas, water_leak, panic_button, door, window, motion, glass_break, vibration, climate, temperature, humidity, light_level, smart_plug, smart_light, smart_switch, siren, lock, valve] }
        protocol: { type: string, enum: [wifi, bluetooth, zigbee, zwave, thread, lora, rf433, wired, other] }
        location: { type: string, maxLength: 80 }
        source: { type: object, description: 'push (reports with the ingest token) or mqtt (a state topic, an optional availability topic and a map from its payload to canonical fields)' }
        commands: { type: object, description: 'mqtt { topic, on, off, toggle, assume_state } and/or http { on, off, toggle } (URLs on the local network only)' }
        expected_interval_s: { type: integer, minimum: 0, description: Seconds of silence after which the device is offline; 0 never }
    AutomationInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        when_mode: { type: string, enum: [any, armed, disarmed] }
        trigger: { type: object, description: 'device { device_id, field, equals } | alarm { severity?, source_type?, source_id? } | mode { mode }' }
        actions: { type: array, maxItems: 6, items: { type: object, description: 'device { device_id, command: on|off|toggle, for_s? } | notify' } }
    NewUser:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{2,39}$' }
        password: { type: string, minLength: 8, maxLength: 200, description: 12 characters or more when the server is reachable from the network }
        role: { type: string, enum: [admin, operator], default: operator, description: An administrator also manages users }
    UserChange:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{2,39}$' }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { type: string, enum: [admin, operator] }
    AccountChange:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword: { type: string }
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{2,39}$' }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    Rules:
      type: object
      additionalProperties: false
      required: [dwell_ms, zones]
      properties:
        schema: { type: integer, enum: [1] }
        dwell_ms: { type: integer, minimum: 0, maximum: 60000, description: Time a two-target condition must persist before it is high }
        zones:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, name, action, x_min_mm, x_max_mm, y_min_mm, y_max_mm]
            properties:
              id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,39}$' }
              name: { type: string, maxLength: 80 }
              action: { type: string, enum: [ignore] }
              node_id: { type: string }
              sensor_id: { type: integer, minimum: 1, maximum: 3 }
              x_min_mm: { type: number }
              x_max_mm: { type: number }
              y_min_mm: { type: number }
              y_max_mm: { type: number }
    StudioLogin: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } }
    PtzCommand: { type: object, required: [command], properties: { command: { type: string, enum: [left, right, up, down, zoomIn, zoomOut, stop] } } }
    CameraInput:
      type: object
      required: [id, name, host]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._-]{3,80}$' }
        name: { type: string, maxLength: 80 }
        host: { type: string, maxLength: 253 }
        username: { type: string }
        password: { type: string, description: Write-only; an empty value keeps the stored one }
        rtspPath: { type: string }
        snapshotUrl: { type: string }
        onvifPort: { type: integer, minimum: 1, maximum: 65535 }
        rtspPort: { type: integer, minimum: 1, maximum: 65535 }
    SystemState:
      type: object
      required: [mode, revision, nodes, updated_at]
      properties:
        mode: { type: string, enum: [armed, disarmed] }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
        nodes:
          type: object
          additionalProperties:
            type: object
            required: [node_id, online, stale, timestamp_ms, lux, target_count, alert_level, panel]
            properties:
              node_id: { type: string }
              online: { type: boolean, description: Reported online and heard from recently }
              stale: { type: boolean, description: Silent for longer than ARMOR_NODE_STALE_AFTER_S }
              timestamp_ms: { type: integer }
              lux: { type: [number, 'null'] }
              target_count: { type: integer }
              panel:
                type: [object, 'null']
                description: Where the node's own web panel is, as the node said itself in its information message; null until it has. Not stored, the node repeats it.
                properties:
                  name: { type: string }
                  firmware: { type: string }
                  ip: { type: string }
                  port: { type: integer }
              targets:
                type: array
                maxItems: 15
                description: The targets of the node's latest report, in the radar's own frame; empty until it reports and after a restart. `counted` is false inside an ignore zone.
                items:
                  type: object
                  required: [sensor_id, track_id, x_mm, y_mm, speed_mm_s, counted]
                  properties:
                    sensor_id: { type: integer }
                    track_id: { type: integer }
                    x_mm: { type: number, description: Sideways, millimetres }
                    y_mm: { type: number, description: Forward, millimetres }
                    speed_mm_s: { type: number }
                    counted: { type: boolean }
              alert_level: { type: string, enum: [normal, review, high] }
