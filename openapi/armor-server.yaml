      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/PublicUser' } } } }
        '400': { description: Invalid value, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Unknown user, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'Name taken, or it would leave no administrator', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: Delete a user (an administrator only; never yourself or the last administrator)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown user, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'Yourself, or the last administrator', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/users/{id}/pin:
    put:
      summary: Set the PIN that disarms the system, and optionally a duress PIN, for a user (an administrator only); the PIN is never shown again
      security: [{ admin: [] }]
