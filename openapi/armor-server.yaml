openapi: 3.1.0
info:
  title: A.R.M.O.R. Server API
  version: 0.7.8
  description: >-
    The HTTP surface of ARMOR-SERVER. Message bodies reference the JSON Schemas
    published in src/armor_common/schemas, which are the single source of truth.
    Every route that configures, moves, captures, records, protects or deletes
    needs an operator (a Studio session cookie, an operator session or the
    operator bearer token).
servers:
  - url: http://127.0.0.1:8080
paths:
  /healthz:
    get:
      security: []
      summary: Liveness, no credentials
      responses:
        '200': { description: Service ready, content: { application/json: { schema: { $ref: '#/components/schemas/HealthzStatus' } } } }
  /api/v1/status:
    get:
      security: [{ operator: [] }]
      summary: Read-only system projection (operator)
      responses:
        '200':
          description: Mode, revision and every node with its stale/offline state
          content: { application/json: { schema: { $ref: '#/components/schemas/SystemState' } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/info:
    get:
      security: [{}, { operator: [] }, { studio: [] }]
      summary: Server version and uptime; the mode and enabled capabilities only for an operator
      responses:
        '200': { description: Server information, content: { application/json: { schema: { $ref: '#/components/schemas/ServerInfo' } } } }
  /api/v1/telemetry:
    post:
      summary: Field-node telemetry
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/telemetry.schema.json' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { description: Invalid payload, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/solar:
    get:
      summary: The latest reading of every solar inverter and battery stack that a gateway node reports, with whether each is stale, and the sums Studio shows
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ devices: [{ node_id, device, kind, reading, received_at, stale, example, registered? }], waiting: [declared devices with no reading yet], totals, catalog: { inverter_models, battery_models, connections } }', content: { application/json: { schema: { $ref: '#/components/schemas/SolarOverview' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    post:
      summary: A solar message over HTTP (an ingest token); the same payloads as armor/solar/{node_id}/{device}/state
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostSolarRequest' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { description: Invalid payload, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/solar/devices:
    post:
      summary: Declare a solar inverter or battery stack (name, model, connection, gateway node), or change the one with the same node and device; it shows as waiting until its gateway node reports
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostSolarDevicesRequest' } } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { $ref: '#/components/schemas/SolarDeviceRegistration' } } } }
        '201': { description: Declared, content: { application/json: { schema: { $ref: '#/components/schemas/SolarDeviceRegistration' } } } }
        '400': { description: Invalid input, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'The node and device exist with another kind, or there are too many devices', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/devices/{node}/{device}:
    delete:
      summary: Forget a declared solar device and its readings
      security: [{ operator: [] }]
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }, { name: device, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Removed }
        '400': { description: Invalid node or device, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '404': { description: Unknown solar device, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/solar/devices/{node}/{device}/example:
    post:
      summary: One made-up reading of a declared device, marked as an example, to try the menus before a gateway node reports
      security: [{ operator: [] }]
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }, { name: device, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '404': { description: The device was not declared, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Take away the example reading of a declared device, so that it waits for its first real reading (a device that reports for real is never touched)
      security: [{ operator: [] }]
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }, { name: device, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: The example reading was removed }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '404': { description: The device has no example reading, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/examples:
    delete:
      summary: Take away every example reading, so that the devices wait for their first real reading (a device that reports for real is never touched)
      security: [{ operator: [] }]
      responses:
        '200': { description: How many example readings were removed, content: { application/json: { schema: { $ref: '#/components/schemas/SolarExamplesRemoved' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/solar/energy:
    get:
      summary: What the panels made, the load used and the battery took and gave, day by day (the last `days`, default 30, at most 400), in kilowatt-hours
      security: [{ operator: [] }]
      parameters: [{ name: days, in: query, required: false, schema: { type: integer } }]
      responses:
        '200': { description: '{ days: [{ date, pv_kwh, load_kwh, battery_in_kwh, battery_out_kwh }] }', content: { application/json: { schema: { $ref: '#/components/schemas/SolarEnergy' } } } }
  /api/v1/solar/alarms:
    get:
      summary: The levels at which batteries and inverters raise alarms (charge, cell spread, temperatures, wear, heat sink) and their defaults
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ settings, defaults }', content: { application/json: { schema: { $ref: '#/components/schemas/SolarAlarmSettings' } } } }
    put:
      summary: Change those levels (a field that is left out goes back to its default; every one is range-checked)
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ settings, defaults }', content: { application/json: { schema: { $ref: '#/components/schemas/SolarAlarmSettings' } } } }
        '400': { description: 'A level out of its range, an unknown one, or a charge that ends below where it starts', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/history:
    get:
      summary: The recent history of one solar device, a few numbers per sample, oldest first
      security: [{ operator: [] }]
      parameters:
        - { name: node, in: query, required: true, schema: { type: string } }
        - { name: device, in: query, required: true, schema: { type: string } }
        - { name: minutes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440 } }
      responses:
        '200': { description: '{ node_id, device, kind, samples: [{ t, ... }] }', content: { application/json: { schema: { $ref: '#/components/schemas/SolarHistory' } } } }
        '400': { description: Missing or invalid node or device, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/health:
    post:
      summary: Field-node health
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/health.schema.json' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { description: Invalid payload, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/node-health:
    post:
      summary: 'The health report of a node of any family - radar, solar, electrical, alarm or hmi (the `node_health` message of the shared contract, ingest token); the same message arrives over MQTT on armor/health/{node_id}. A field this server does not know is dropped and said in `ignored`.'
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/node_health.schema.json' } } } }
      responses:
        '202': { description: 'Accepted; { accepted, ignored? }', content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { description: Not the contract's message, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Missing or wrong ingest token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    get:
      summary: 'The latest report of every node with what the server makes of it ({ nodes, waiting, totals, levels }): the status (ok, warning, or stale after three minutes without a report), the warnings (node_low_memory, node_frequent_resets, node_link_flapping, node_weak_signal), the restarts of the last day, the levels the server judges by, and the nodes that are known but have sent no report yet (an older firmware)'
      security: [{ operator: [] }]
      responses:
        '200': { description: The health of the nodes, content: { application/json: { schema: { $ref: '#/components/schemas/NodeHealthList' } } } }
  /api/v1/node-health/{id}:
    get:
      summary: One node with the history of its memory and signal (up to 120 reports) and the log of its restarts, newest first
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The node, content: { application/json: { schema: { $ref: '#/components/schemas/NodeHealthDetail' } } } }
        '404': { description: Unknown node, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Forget a node that was taken away, with its health warnings (an administrator only)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Forgotten }
        '404': { description: Unknown node, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/nodes/control:
    post:
      summary: >-
        Give ONE order to EVERY node (radar, solar, electrical, alarm and hmi nodes that report lately; never the server or the CM5): restart, pause, resume, standby, identify, diagnostics, maintenance_on or
        maintenance_off. For an administrator who proved themselves again a moment ago (the password or the second factor, whatever the origin). `confirm` is the word RESTART, PAUSE or STANDBY, typed, for
        those three operations. `mode` `rolling` is only for a restart (the nodes go one after another, thirty seconds apart, the alarm panel last; recommended); `now` acts on all together. Standby is
        the node's work switched off while it stays connected, not a power-off. The server asks every node to arm (the `node_control_command` message of the shared contract), then executes with each
        node's one-time token, which is bound to the operation. 202 means sent: the operation shows, per node, what it answered. There is no factory reset, no erase and no deep sleep.
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeControlAllRequest' } } } }
      responses:
        '202': { description: 'Sent; the operation, with a line per node', content: { application/json: { schema: { $ref: '#/components/schemas/NodeControlOperation' } } } }
        '400': { description: 'invalid_request: the operation, the mode, the word typed or the duration is not right', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is old (code elevation_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'busy: an order is still under way; no_nodes: no node has reported lately', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many orders, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'mqtt_unavailable: the broker is not connected', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/diagnostics/tokens:
    post:
      summary: >-
        Issue a READ-ONLY diagnostic token (an administrator who proved themselves again a moment ago). The token lets a person who has no account look at why the nodes the administrator chose misbehave:
        it reads, with GET and nothing else, the health, the latest diagnostic package and the latest log of those nodes until it expires (`ttl_s` 300 to 86400, 7200 when absent) or is revoked. It
        cannot order anything, change anything, read another node or anything of the house, and it never reaches a node: it reads what the server already holds. The secret (`token`) is in this answer
        and nowhere else; the server keeps only its SHA-256. At most twenty tokens are active at a time. Issue, use and revocation are in the audit trail and the History.
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/diagnostic_token_request.schema.json' } } } }
      responses:
        '201': { description: 'The token, shown once', content: { application/json: { schema: { $ref: '../src/armor_common/schemas/diagnostic_token_created.schema.json' } } } }
        '400': { description: 'invalid_request', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is old (code elevation_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'unknown_node: no node of that name has reported', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'too_many_tokens: twenty are active already; revoke one first', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many tokens asked for, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      summary: The diagnostic tokens, newest first, with who issued them, for which nodes, until when, how often they were used and whether they are active, expired or revoked (an administrator); never a secret and never a hash
      security: [{ admin: [] }]
      responses:
        '200': { description: The tokens, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticTokenList' } } } }
  /api/v1/diagnostics/tokens/{id}:
    delete:
      summary: Revoke a diagnostic token now (an administrator); a token that is revoked or expired is refused at once
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-f0-9]{12}$' } }]
      responses:
        '204': { description: Revoked }
        '404': { description: 'not_found: there is no active token of that id', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/diagnostics/nodes:
    get:
      summary: >-
        The nodes a read-only diagnostic token covers, with their status and when a package and a log were last delivered. Called WITH the token (`Authorization: Bearer armor-diag-...`), not with
        a session. Every refusal of an unknown, expired or revoked token is the same 401; a token that makes more than thirty requests a minute, or an address that is refused twenty times a minute, gets 429.
      security: [{ diagnosticBearer: [] }]
      responses:
        '200': { description: The nodes of the token, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticNodes' } } } }
        '401': { description: 'invalid_token: not a token, or expired, or revoked', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many requests or too many refused attempts, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/diagnostics/nodes/{id}:
    get:
      summary: The health of one node of the token, with the history of its memory and signal and the log of its restarts; the last error is washed again and the name of the person who last ordered the node is left out
      security: [{ diagnosticBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }]
      responses:
        '200': { description: The node, content: { application/json: { schema: { $ref: '#/components/schemas/NodeHealthDetail' } } } }
        '401': { description: 'invalid_token', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'out_of_scope: the token does not cover this node', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'not_found: the node has not reported', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many requests, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/diagnostics/nodes/{id}/package:
    get:
      summary: The latest diagnostic package the node delivered (memory, tasks, why it last started, versions, the allowed part of its settings, the core dump summary, the newest log), washed again of anything that looks like a credential
      security: [{ diagnosticBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }]
      responses:
        '200': { description: The package, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticPackageAnswer' } } } }
        '401': { description: 'invalid_token', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'out_of_scope', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'no_package: the node has delivered none', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many requests, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/diagnostics/nodes/{id}/log:
    get:
      summary: The latest log the node delivered, washed again
      security: [{ diagnosticBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }]
      responses:
        '200': { description: The log, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticLogAnswer' } } } }
        '401': { description: 'invalid_token', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'out_of_scope', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'no_log: the node has delivered none', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many requests, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/nodes/{id}/diagnostics:
    get:
      summary: What the node delivered when an administrator asked for its diagnostics with `detail` package or log - the latest package and the latest log, with the moment and the person who asked (an administrator)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }]
      responses:
        '200': { description: What the node delivered, content: { application/json: { schema: { $ref: '#/components/schemas/NodeDiagnostics' } } } }
        '404': { description: Unknown node, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/nodes/{id}/diagnostics/package:
    get:
      summary: The latest package of the node; with `?download=1` as a file to keep (an administrator, audited)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }, { name: download, in: query, required: false, schema: { type: string, enum: ['1'] } }]
      responses:
        '200': { description: The package, content: { application/json: { schema: { $ref: '#/components/schemas/DiagnosticPackageAnswer' } } } }
        '404': { description: 'no_package: the node has delivered none', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/nodes/{id}/diagnostics/log:
    get:
      summary: The latest log of the node as plain text; with `?download=1` as a file to keep (an administrator, audited)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }, { name: download, in: query, required: false, schema: { type: string, enum: ['1'] } }]
      responses:
        '200': { description: The log as plain text, content: { text/plain: { schema: { $ref: '#/components/schemas/PlainText' } } } }
        '404': { description: 'no_log: the node has delivered none', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/radar/events:
    get:
      summary: The newest events of the perimeter engine of the radar nodes (a zone taken or left, a target that stays, a line crossed, a covered sensor, a sensor whose own Bluetooth is open ...), newest first; `node` narrows to one node, `limit` is 1 to 500 (100 when absent)
      security: [{ operator: [] }]
      parameters: [{ name: node, in: query, required: false, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }, { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }]
      responses:
        '200': { description: The events, content: { application/json: { schema: { $ref: '#/components/schemas/RadarEventList' } } } }
        '400': { description: 'invalid_request', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/nodes/maintenance:
    get:
      summary: The planned-maintenance windows held now, from nodes that announced them and from operators (any signed-in user); each one is bounded by the server
      security: [{ operator: [] }]
      responses:
        '200': { description: The windows, content: { application/json: { schema: { $ref: '#/components/schemas/NodeMaintenanceList' } } } }
  /api/v1/nodes/control/operations:
    get:
      summary: The orders given to nodes in the last weeks, newest first, with the line of each node (an administrator); never a token
      security: [{ admin: [] }]
      responses:
        '200': { description: The operations, content: { application/json: { schema: { $ref: '#/components/schemas/NodeControlList' } } } }
  /api/v1/nodes/control/operations/{id}:
    get:
      summary: One order as it stands now, with what each node did (an administrator); never a token
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]{8,32}$' } }]
      responses:
        '200': { description: The operation, content: { application/json: { schema: { $ref: '#/components/schemas/NodeControlOperation' } } } }
        '404': { description: 'Unknown operation', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/nodes/{id}/control:
    post:
      summary: >-
        Give ONE order to ONE node without opening its configurator: restart, pause, resume, standby, identify, diagnostics, maintenance_on or maintenance_off (an administrator who proved themselves
        again a moment ago). For restart, pause and standby, on every node, `confirm` is the NAME of the node, typed again; the other operations need none. The server asks the node to arm (the
        `node_control_command` message of the shared contract) and executes with the one-time token of the node, bound to the operation, as soon as it answers. A restart is a clean restart and the
        node says `restarting` before it goes; a pause stops the node's work for `duration_s` (60 to 3600, 3600 when absent) and resumes by itself; standby switches the work off until a resume (the node
        stays connected and keeps answering, and stays in standby across restarts); identify blinks the node for 5 to 300 s; maintenance_on holds back the node-offline alert for 60 to 28800 s. While
        the node installs a firmware, receives an upload, copies a slot or runs a battery operation it refuses restart, pause and standby. The server and the CM5 are not nodes and cannot be
        controlled this way. There is no factory reset, no erase and no deep sleep.
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NodeControlRequest' } } } }
      responses:
        '202': { description: 'Sent; the operation, with the line of the node', content: { application/json: { schema: { $ref: '#/components/schemas/NodeControlOperation' } } } }
        '400': { description: 'invalid_request: the name typed is not the node, or the operation or the duration is not right', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is old (code elevation_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'unknown_node: no node of that name has reported', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'busy: an order for this node is still under way; node_unavailable: the node has not reported lately; already_in_state: it is in that state already', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many orders, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'mqtt_unavailable: the broker is not connected', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/control/{mode}:
    post:
      summary: Arm or disarm
