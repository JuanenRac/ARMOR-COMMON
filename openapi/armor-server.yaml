      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The document of that version, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkDesign' } } } }
        '404': { description: Unknown version, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Forget one kept version of the network design
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Forgotten }
        '404': { description: Unknown version, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/network/commands:
    post:
      summary: Hand an ARMOR-NETWORK node a manual order (a sweep now, a ping, a traceroute, a wake-up, the ports or the web page of one device); the node gets it in the answer to its next message
      security: [{ operator: [] }]
      responses:
        '202': { description: 'The order, queued', content: { application/json: { schema: { $ref: '#/components/schemas/NetworkCommand' } } } }
        '400': { description: 'An order that does not exist, a device the node does not know, a device with no MAC to wake, a port that is not one', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: No such network node, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: The node is not reporting, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    get:
      summary: The latest orders and what became of them (newest first)
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ commands }', content: { application/json: { schema: { $ref: '#/components/schemas/NetworkCommandList' } } } }
  /api/v1/network/commands/{id}:
    get:
      summary: One order with its status (queued, sent, done, expired) and, when the node has reported, its result
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The order, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkCommand' } } } }
        '404': { description: Unknown order, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/automations:
    get:
      summary: The automations
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ automations }', content: { application/json: { schema: { $ref: '#/components/schemas/AutomationList' } } } }
    post:
      summary: Create an automation (a trigger, an optional mode, and up to six actions)
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationInput' } } } }
      responses:
        '201': { description: The automation, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        '400': { description: Invalid trigger or actions, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Too many automations, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/automations/{id}:
    patch:
      summary: Change an automation
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationInput' } } } }
      responses:
        '200': { description: The automation, content: { application/json: { schema: { $ref: '#/components/schemas/Automation' } } } }
        '404': { description: Unknown automation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Delete an automation
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Deleted }
        '404': { description: Unknown automation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/automations/{id}/run:
    post:
      summary: Run an automation now, to try it; audited, and subject to its rate limit
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Ran, content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
        '404': { description: Unknown automation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/site:
    get:
      summary: The site design kept on the server ({ revision, updated_at, updated_by, site })
      security: [{ operator: [] }]
      responses:
        '200': { description: 'The design, or revision 0 with a null site when none has been saved', content: { application/json: { schema: { $ref: '#/components/schemas/SiteDesign' } } } }
    put:
      summary: Save the site design; `revision` must be the one last read, or the save is refused with the current design (up to 768 kB)
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutSiteRequest' } } } }
      responses:
        '200': { description: '{ revision, updated_at, updated_by }', content: { application/json: { schema: { $ref: '#/components/schemas/DesignSaved' } } } }
        '400': { description: 'The site is not an object, or too large', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Someone else saved first; the answer carries `current`, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/electrical/design:
    get:
      summary: The electrical design (the house's electrical diagram) kept on the server ({ revision, updated_at, updated_by, electrical })
      security: [{ operator: [] }]
      responses:
        '200': { description: 'The design, or revision 0 with a null electrical when none has been saved', content: { application/json: { schema: { $ref: '#/components/schemas/ElectricalDesign' } } } }
    put:
      summary: Save the electrical design; `revision` must be the one last read, or the save is refused with the current design (up to 768 kB). Kept apart from the site design.
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutElectricalDesignRequest' } } } }
      responses:
        '200': { description: '{ revision, updated_at, updated_by }', content: { application/json: { schema: { $ref: '#/components/schemas/DesignSaved' } } } }
        '400': { description: 'The design is not an object, or too large', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Someone else saved first; the answer carries `current`, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/electrical/devices:
    get:
      summary: The devices of the house that measure or switch electricity (Zigbee plugs and breakers, meters, smart lights) with what they say, whether they can be switched and how much it matters
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ elements: [{ id, name, kind, protocol, location, online, last_seen, risk, on?, power_w?, voltage_v?, current_a?, energy_kwh?, switchable }], totals }', content: { application/json: { schema: { $ref: '#/components/schemas/ElectricalDevices' } } } }
  /api/v1/electrical/readings:
    post:
      summary: A reading from an ARMOR-NODE-ELECTRICAL node (the `electrical` message of the shared contract, one entry per measured channel); the same message arrives over MQTT on armor/electrical/{node_id}/state
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/electrical.schema.json' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { description: The message breaks the contract, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authentication failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    get:
      summary: The latest reading of every electrical node ({ nodes, totals }); a node that has been silent for a minute is stale
      security: [{ operator: [] }]
      responses:
        '200': { description: 'The readings and the sums (grid power and energy, alarms)', content: { application/json: { schema: { $ref: '#/components/schemas/ElectricalReadings' } } } }
  /api/v1/electrical/energy:
    get:
      summary: The energy of every electrical channel per day (the last N days, 30 by default), adding up only the difference between readings so a meter that wraps or is reset does not break the sum
      security: [{ operator: [] }]
      parameters: [{ name: days, in: query, schema: { type: integer, minimum: 1, maximum: 400 } }]
      responses:
        '200': { description: '{ channels: [{ node, channel, days: [{ day, kwh, resets }] }] }', content: { application/json: { schema: { $ref: '#/components/schemas/ElectricalEnergy' } } } }
  /api/v1/electrical/history:
    get:
      summary: The recent samples (voltage, current, power, energy) of one channel of one node, oldest first
      security: [{ operator: [] }]
      parameters:
        - { name: node, in: query, required: true, schema: { type: string } }
        - { name: channel, in: query, required: true, schema: { type: string } }
        - { name: minutes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440 } }
      responses:
        '200': { description: '{ node_id, channel, minutes, samples }', content: { application/json: { schema: { $ref: '#/components/schemas/ElectricalHistory' } } } }
        '400': { description: node and channel are required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Unknown node or channel, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/electrical/switching:
    get:
      summary: Whether the server may send commands to the switches of electrical nodes (off unless ARMOR_ELECTRICAL_SWITCHING=1), the commands still waiting for a node's answer, and what became of the latest ones ({ enabled, pending, recent }); never a token
      security: [{ operator: [] }]
      responses:
        '200': { description: The switching status, content: { application/json: { schema: { $ref: '#/components/schemas/ElectricalSwitching' } } } }
  /api/v1/electrical/switch:
    post:
      summary: >-
        A command to one switch of one electrical node (an administrator only), published to armor/electrical/{node_id}/command (the `electrical_command` message of the shared contract).
        Closing is two calls: arm, then close_a or close_b once the node accepted the arm (the server keeps the node's one-time token and attaches it). Refused unless the server has switching
        turned on, the node reports itself as allowed to switch and has that switch, and no fault is latched (except to open or acknowledge). Answered 202: the node's own answer arrives on
        armor/electrical/{node_id}/result and is shown by GET /api/v1/electrical/switching; an accepted command is not a switch that closed, only the node's state says that.
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostElectricalSwitchRequest' } } } }
      responses:
        '202': { description: 'Published; { accepted, command_id }', content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { description: 'node, switch and a valid action are required', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or switching is not turned on (code switching_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'unknown_node or unknown_switch', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'node_unavailable, node_not_switching, switch_fault, busy or not_armed', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many switch commands, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'mqtt_unavailable: the broker is not connected', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/battery-ops/catalog:
    get:
      summary: >-
        The typed operations that write to a Pylontech battery (their risk, values and ranges: the table of ARMOR-COMMON battery_ops.json) and whether this server allows writing at all
        ({ enabled, catalog }); writing is off unless ARMOR_BATTERY_WRITE=1
      security: [{ operator: [] }]
      responses:
        '200': { description: The table and the switch, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOpsCatalog' } } } }
  /api/v1/solar/battery-ops:
    get:
      summary: The battery operations of the last weeks, newest first, with what was read before and after, the difference and the transcript (an administrator; the service password never appears in any of it)
      security: [{ admin: [] }]
      responses:
        '200': { description: The operations, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOperationList' } } } }
    post:
      summary: >-
        Step one of writing to a battery (an administrator who proved themselves again a moment ago): the server checks the values against the table, sends an `arm` to the node (the
        `solar_battery_command` message of the shared contract) and answers 202 with the operation. The node reads the battery and checks every precondition; GET the operation to see it armed
        (with what it will do and the battery's identity) or rejected. Nothing is written yet. The typed serial number must be the one the battery reports.
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryArmRequest' } } } }
      responses:
        '202': { description: 'Sent; the operation, still arming', content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOperation' } } } }
        '400': { description: 'invalid_request or invalid_params: the node, port, operation, serial or values are not right', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, writing is not turned on (code battery_write_disabled), or the proof of identity is old (code elevation_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'unknown_node: no battery of that node is reporting', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'busy, image_missing or locked', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: 'Too many orders', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'mqtt_unavailable: the broker is not connected', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/battery-ops/images:
    post:
      summary: >-
        Keep a firmware image for a battery (the .bin the maker publishes, as application/octet-stream, 64 KiB to 512 KiB; an administrator who proved themselves again): the server reads the
        board name and version in its header and answers with its size, CRC-32 and SHA-256. The image is kept for an hour in memory only, and nothing is sent to a battery until a
        firmware_update is armed and executed with the typed serial number; the node checks that the image fits the battery's model and chip and refuses to send it otherwise.
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
      responses:
        '201': { description: The image as the server read it, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryImage' } } } }
        '400': { description: 'image_size or image_header: not a firmware image of the family', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, writing is not turned on or the proof of identity is old (code elevation_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '415': { description: Not sent as application/octet-stream, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/battery-ops/{id}:
    get:
      summary: One battery operation as it stands now (an administrator); never a token
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]{8,32}$' } }]
      responses:
        '200': { description: The operation, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOperation' } } } }
        '404': { description: 'Unknown operation', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/battery-ops/{id}/execute:
    post:
      summary: >-
        Step two (an administrator who proved themselves again a moment ago): the operation must be armed and not expired (two minutes), and the typed serial number is asked for again. The
        server sends `execute` with the node's one-time token; the node writes, reads back and answers. 202 means sent; only the operation's outcome says whether it worked.
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]{8,32}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryExecuteRequest' } } } }
      responses:
        '202': { description: Sent, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOperation' } } } }
        '400': { description: 'The serial number does not match the one typed to arm', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, writing is not turned on or the proof of identity is old (code elevation_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'Unknown operation', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'not_armed, expired or busy', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: 'Too many orders', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'mqtt_unavailable', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/battery-ops/{id}/cancel:
    post:
      summary: Ask for an operation to stop (an administrator). It is honoured between two steps and never in the middle of a sequence that must not be cut (EEPROM, serial number, firmware); an armed operation that was not executed is simply withdrawn
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]{8,32}$' } }]
      responses:
        '202': { description: Sent or withdrawn, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOperation' } } } }
        '404': { description: 'Unknown operation', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'not_cancellable: it has gone too far to be stopped, or it is over', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/solar/battery-ops/{id}/restore:
    post:
      summary: Arm the operation that puts back what an earlier operation changed, from what was read before it (only for the operations whose previous state can be read back, such as switching an output); an administrator who proved themselves again
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9]{8,32}$' } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BatteryExecuteRequest' } } } }
      responses:
        '202': { description: 'The new operation, arming', content: { application/json: { schema: { $ref: '#/components/schemas/BatteryOperation' } } } }
        '404': { description: 'Unknown operation', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'not_restorable: that operation has nothing to put back', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/alarm/state:
    post:
      summary: The state of an alarm node's panel (the `alarm` message of the shared contract, ingest token); the same message arrives over MQTT on armor/alarm/{node_id}/state. A field this server does not know is dropped and said in `ignored`.
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/alarm.schema.json' } } } }
      responses:
        '202': { description: 'Accepted; { accepted, ignored? }', content: { application/json: { schema: { $ref: '#/components/schemas/Accepted' } } } }
        '400': { description: Not the contract's message, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Missing or wrong ingest token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/alarm/nodes:
    get:
      summary: The latest state of every alarm node ({ nodes, totals }); a node that has been silent for thirty seconds is stale
      security: [{ operator: [] }]
      responses:
        '200': { description: 'The states and the sums (nodes, stale, armed, sounding)', content: { application/json: { schema: { $ref: '#/components/schemas/AlarmNodes' } } } }
  /api/v1/cameras/{id}/ignore-zones:
    get:
      summary: 'The parts of the camera''s picture that the observation service does not look at ({ camera_id, zones: [{ x, y, w, h }] }, fractions of the picture from the top left)'
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The zones, content: { application/json: { schema: { $ref: '#/components/schemas/IgnoreZones' } } } }
        '404': { description: Unknown camera, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    put:
      summary: Replace them (an administrator only; at most 16 rectangles inside the picture). Nothing is cut from the video or the photos; only the movement detection leaves those pixels out
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/IgnoreZonesInput' } } } }
      responses:
        '200': { description: The zones as kept, content: { application/json: { schema: { $ref: '#/components/schemas/IgnoreZones' } } } }
        '400': { description: 'A zone is not a rectangle inside the picture, or there are too many', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Unknown camera, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/capture-settings:
    get:
      summary: 'What the server takes by itself when a camera sees something while the perimeter is armed ({ settings: { enabled, photo, photo_count, photo_interval_s, video, video_seconds, cooldown_s }, recent: the latest captures })'
      security: [{ operator: [] }]
      responses:
        '200': { description: The settings and the latest automatic captures, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSettingsState' } } } }
    put:
      summary: Set them (an administrator only). A photo (or photo_count of them, photo_interval_s apart, 1 to 60 and 1 to 300 seconds) and a video of video_seconds (3 to 300) are taken when the AI observation service reports something on a camera while the system is armed, and a camera is left alone for cooldown_s (5 to 3600) afterwards
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSettings' } } } }
      responses:
        '200': { description: The settings as kept, content: { application/json: { schema: { $ref: '#/components/schemas/CaptureSettingsSaved' } } } }
        '400': { description: 'A value is out of range, not the right type or unknown', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/security/settings:
    get:
      summary: The security options in force (an administrator only), the ones stored, the defaults and the ones the environment of the server fixes
      security: [{ admin: [] }]
      responses:
        '200': { description: The options, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettingsState' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    put:
      summary: Change one or more options (an administrator only; from outside the house after proving identity again). A name that does not exist, a value that is not on its list or an option the environment fixes is a 400 and nothing changes. The audit trail says which changes lower the security
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettings' } } } }
      responses:
        '200': { description: The options after the change, content: { application/json: { schema: { $ref: '#/components/schemas/SecuritySettingsState' } } } }
        '400': { description: 'Unknown option, invalid value or fixed by the environment (code invalid_setting, setting names it)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is needed again', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/alarm/zone-feed/key/{node}:
    get:
      summary: The key a panel verifies the signature of its zone messages with (HMAC-SHA256, 64 hex characters; an administrator only, from outside the house after proving identity again). It is entered in the panel and never travels on the broker
      security: [{ admin: [] }]
      parameters: [{ name: node, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The key of the panel, content: { application/json: { schema: { $ref: '#/components/schemas/ZoneFeedKey' } } } }
        '400': { description: Not a node id, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is needed again', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/alarm/zone-links:
    get:
      summary: 'The Zigbee devices linked to zones of alarm panels ({ links: [{ device_id, node_id, zone_id }] })'
      security: [{ operator: [] }]
      responses:
        '200': { description: The links, content: { application/json: { schema: { $ref: '#/components/schemas/ZoneLinks' } } } }
    put:
      summary: Replace the links (an administrator only; at most 64, one device per zone). While this server holds the Zigbee radio it publishes each linked zone's state on armor/alarm/{node_id}/zigbee ({ zone, state "normal" | "triggered" | "tamper", battery_low }) on every change and every 30 seconds
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ZoneLinks' } } } }
      responses:
        '200': { description: The links as kept, content: { application/json: { schema: { $ref: '#/components/schemas/ZoneLinks' } } } }
        '400': { description: 'A link is malformed, repeated or has an unknown field', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/push/status:
    get:
      summary: Whether push to the phones through Firebase is on (it is only when the installation has its own service account) and how many phones are registered ({ enabled, devices })
      security: [{ admin: [] }]
      responses:
        '200': { description: The status, content: { application/json: { schema: { $ref: '#/components/schemas/PushStatus' } } } }
  /api/v1/push/register:
    post:
      summary: A phone registers the token that Firebase gave its app ({ token }), with its signed-in session (a viewer too). At most 50 phones are kept; the oldest makes room
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostPushRegisterRequest' } } } }
      responses:
        '200': { description: Already registered, content: { application/json: { schema: { $ref: '#/components/schemas/PushRegistered' } } } }
        '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/PushRegistered' } } } }
        '400': { description: The token is not valid, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Push is off on this installation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: A phone takes its token back (when the person signs out)
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeletePushRegisterRequest' } } } }
      responses:
        '200': { description: Not registered any more, content: { application/json: { schema: { $ref: '#/components/schemas/PushRegistered' } } } }
  /api/v1/push/unregister:
    post:
      summary: The same as DELETE /api/v1/push/register, for a phone whose HTTP stack sends no body with DELETE
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostPushUnregisterRequest' } } } }
      responses:
        '200': { description: Not registered any more, content: { application/json: { schema: { $ref: '#/components/schemas/PushRegistered' } } } }
  /api/v1/alarm/profiles:
    get:
      summary: 'The arming profiles - the named ways of arming an alarm panel (Away, Home, Night and the owner''s own) - with the revision of the list ({ revision, updated_at, updated_by, profiles, max }); each is an `arm_profile` of the shared contract'
      security: [{ operator: [] }]
      responses:
        '200': { description: The profiles, content: { application/json: { schema: { $ref: '#/components/schemas/ArmProfiles' } } } }
    put:
      summary: 'Replace the whole list of profiles (an administrator only): at most eight, an id once, and away and stay always present with their own base. `revision` is the one the editor read; another change in between is a 409 with the current list, never a silent overwrite. Editing a profile arms nothing and changes nothing on a panel that is already armed.'
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutAlarmProfilesRequest' } } } }
      responses:
        '200': { description: 'Saved; the new list', content: { application/json: { schema: { $ref: '#/components/schemas/ArmProfiles' } } } }
        '400': { description: 'invalid_profiles: the list does not follow the contract', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'conflict: the profiles changed since they were read; { current }', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/alarm/commands:
    get:
      summary: Whether the server may arm, disarm and silence alarm nodes (off unless ARMOR_ALARM_COMMANDS=1), the commands still waiting for a node's answer, and what became of the latest ones ({ enabled, pending, recent })
      security: [{ operator: [] }]
      responses:
        '200': { description: The status of the commands, content: { application/json: { schema: { $ref: '#/components/schemas/AlarmCommandStatus' } } } }
  /api/v1/alarm/command:
    post:
      summary: >-
        A command to the panel of one alarm node (an administrator only), published to armor/alarm/{node_id}/command (the `alarm_command` message of the shared contract): arm in away or stay
        (optionally forced), disarm, or silence the siren (the system stays armed and the alarm stays latched; as sensitive as a disarm). A disarm or a silence needs the `pin` of the signed-in user, checked by the server (a wrong one counts toward the same lockout as a wrong disarm PIN) and never sent to the node (the message to the node has none). Refused unless the server has the commands turned on, the node says in its state that it accepts them, and nothing is waiting for an
        answer from it. Answered 202: the node's own answer arrives on armor/alarm/{node_id}/result and is shown by GET /api/v1/alarm/commands; an accepted command is not an armed alarm, only
        the node's state says that.
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAlarmCommandRequest' } } } }
      responses:
        '202': { description: 'Published; { accepted, command_id }', content: { application/json: { schema: { $ref: '#/components/schemas/CommandAccepted' } } } }
        '400': { description: node and a valid action are required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the commands are not turned on (code commands_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'unknown_node, or unknown_profile', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'node_unavailable, node_commands_off, busy or profiles_unsupported (the node does not understand arming profiles)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: Too many alarm commands, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'mqtt_unavailable: the broker is not connected', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/network/state:
    post:
      summary: 'The state of the local network from an ARMOR-NETWORK node (the `network` message of the shared contract, ingest token); the same message arrives over MQTT on armor/network/{node_id}/state. The answer carries the waiting orders; the login of an inspection order comes only to a node that spoke with its own token, sealed for it (`auth_sealed`: base64 of nonce, cipher text and HMAC-SHA256 tag, key from that node''s token)'
      security: [{ ingestBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '../src/armor_common/schemas/network.schema.json' } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkAccepted' } } } }
        '400': { description: The message does not follow the contract, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Missing or wrong ingest token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/network:
    get:
      summary: 'The local network as the nodes see it ({ nodes, totals, events, outages }): every node with its interface, the state of the internet and its devices (each with the name and notes an administrator gave it), the sums, the latest events and the outages'
      security: [{ operator: [] }]
      responses:
        '200': { description: The network, content: { application/json: { schema: { $ref: '#/components/schemas/NetworkOverview' } } } }
  /api/v1/network/history:
    get:
      summary: The recent samples of one node (the internet's state, latency and loss, and the interface's traffic), oldest first
      security: [{ operator: [] }]
      parameters:
        - { name: node, in: query, required: true, schema: { type: string } }
        - { name: minutes, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 1440 } }
      responses:
        '200': { description: '{ node_id, minutes, samples }', content: { application/json: { schema: { $ref: '#/components/schemas/NetworkHistory' } } } }
        '400': { description: node is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Unknown node, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/network/devices/{id}:
    put:
      summary: Name a device, note something about it, mark it as known (which ends the alarm of a new device) or give it a kind of your own (an administrator only; only the fields given change)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutNetworkDevicesIdRequest' } } } }
      responses:
        '200': { description: '{ id, note }', content: { application/json: { schema: { $ref: '#/components/schemas/NetworkDeviceNote' } } } }
        '400': { description: Not a valid note or device id, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: Forget what was kept about a device (an administrator only)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Forgotten }
        '404': { description: Nothing was kept about it, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/network/devices/{id}/login:
    put:
      summary: Keep the login of the web administration of a device, encrypted; the password goes in and never comes out (an administrator only)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutNetworkDevicesIdLoginRequest' } } } }
      responses:
        '200': { description: '{ id, login: { user } }', content: { application/json: { schema: { $ref: '#/components/schemas/NetworkDeviceLogin' } } } }
        '400': { description: Not a valid login or device id, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: Forget the login kept for a device (an administrator only)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Forgotten }
        '404': { description: No login was kept for it, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/network/design:
    get:
      summary: The network design (the house's network drawn in Studio's Network Designer) kept on the server ({ revision, updated_at, updated_by, network })
      security: [{ operator: [] }]
      responses:
        '200': { description: 'The design, or revision 0 with a null network when none has been saved', content: { application/json: { schema: { $ref: '#/components/schemas/NetworkDesign' } } } }
    put:
      summary: Save the network design; `revision` must be the one last read, or the save is refused with the current design (up to 768 kB)
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutNetworkDesignRequest' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DesignSaved' } } } }
        '400': { description: 'Not an object, or too large', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Someone else saved a newer revision; the body has the current design, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/alarm/design/versions:
    get:
      summary: The versions the server keeps of the alarm design (what it was before changes; newest first)
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ versions: [{ id, revision, saved_at, updated_by, counts }] }', content: { application/json: { schema: { $ref: '#/components/schemas/DesignVersions' } } } }
    delete:
      summary: Forget every kept version of the alarm design (the current design is not touched)
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ removed } how many versions were forgotten', content: { application/json: { schema: { $ref: '#/components/schemas/Count' } } } }
  /api/v1/alarm/design/versions/{id}:
    get:
      summary: One version of the alarm design, whole; to take it back, save it as the current one
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The document of that version, content: { application/json: { schema: { $ref: '#/components/schemas/AlarmDesign' } } } }
        '404': { description: Unknown version, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Forget one kept version of the alarm design
      security: [{ operator: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: Forgotten }
        '404': { description: Unknown version, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/alarm/design:
    get:
      summary: The alarm design (the house's alarm drawn in Studio's Alarm Designer - panels, sensors, sirens, keypads and how they are joined) kept on the server ({ revision, updated_at, updated_by, alarm_design })
      security: [{ operator: [] }]
      responses:
        '200': { description: 'The design, or revision 0 with a null alarm_design when none has been saved', content: { application/json: { schema: { $ref: '#/components/schemas/AlarmDesign' } } } }
    put:
      summary: Save the alarm design; `revision` must be the one last read, or the save is refused with the current design (up to 768 kB). It is a drawing - nothing arms, disarms or sounds anything
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutAlarmDesignRequest' } } } }
      responses:
        '200': { description: Saved, content: { application/json: { schema: { $ref: '#/components/schemas/DesignSaved' } } } }
        '400': { description: 'Not an object, or too large', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: Someone else saved a newer revision; the body has the current design, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/system:
    get:
      summary: What the server is and how full it is - version, uptime, mode, counts of nodes, cameras, devices, alarms, automations, users and events, and the space media and the disk use
      security: [{ operator: [] }]
      responses:
        '200': { description: The system summary, content: { application/json: { schema: { $ref: '#/components/schemas/SystemSummary' } } } }
  /api/v1/system/metrics:
    get:
      summary: How the machine the server runs on is doing - processor, memory, temperatures, disks, network cards and the last minutes of them, as a task manager shows it
      security: [{ operator: [] }]
      responses:
        '200': { description: The latest sample and its history, content: { application/json: { schema: { $ref: '#/components/schemas/SystemMetrics' } } } }
  /api/v1/preflight:
    get:
      summary: The check before arming - nodes that do not answer, silent panels, open zones, cameras that are down, open doors and windows and alarms nobody has seen - each finding blocking or only a warning; read only
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ ready, checked_at, blocking, warnings, issues: [{ kind, level, code, id, detail? }] }', content: { application/json: { schema: { $ref: '#/components/schemas/Preflight' } } } }
  /api/v1/system/ingest:
    get:
      summary: What the nodes sent that the server took, refused or partly ignored (fields of a newer firmware), per topic, with the start of the last refused message
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ topics: [{ topic, accepted, rejected, ignored_fields, last_ok_at, last_error, last_error_at, last_payload }] }', content: { application/json: { schema: { $ref: '#/components/schemas/IngestLog' } } } }
  /api/v1/system/services:
    get:
      summary: 'Every service of the system, running or not - the programs of the machine (read from systemd: state, process, memory, restarts, when it started) and the field nodes (online or not) - read only'
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ time_ms, systemd, services: [{ id, name, family, description, kind, state, sub_state?, unit?, enabled?, pid?, since_ms?, memory_bytes?, restarts?, port? }] }; systemd is false where the machine has none', content: { application/json: { schema: { $ref: '#/components/schemas/ServiceList' } } } }
  /api/v1/panel/summary:
    get:
      summary: A few hundred bytes for the screens that cannot take the whole state (the touch panel, a watch) - the mode, the nodes online, the alarms that need a person (the ones nobody has acknowledged first) and the energy of the house (the power of the panels and of the load, the battery's charge and power, and whether the solar equipment reports). The account of a wall panel (the `panel` role) may read this, change the mode and acknowledge alarms, and nothing else
      security: [{ operator: [] }]
      responses:
        '200': { description: The summary, content: { application/json: { schema: { $ref: '#/components/schemas/PanelSummary' } } } }
  /api/v1/system/connection:
    get:
      summary: Where the server listens and where Studio is served - the active address and ports, the saved ones and whether a restart is needed, and whether the link to the broker is encrypted with the fingerprint of the pinned authority (mqtt_tls) (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: The active and the saved connection settings, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionState' } } } }
    put:
      summary: Save the address and ports (host, port, studio_port; an empty one leaves the deployment's value); they take effect when the server is started again
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutSystemConnectionRequest' } } } }
      responses:
        '200': { description: The new state, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionState' } } } }
        '400': { description: Not an acceptable address or port, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/audit:
    get:
      summary: The audit trail, newest first (an administrator only); credentials are scrubbed as it is written
      security: [{ admin: [] }]
      parameters: [{ name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 500 } }]
      responses:
        '200': { description: '{ entries }', content: { application/json: { schema: { $ref: '#/components/schemas/AuditEntries' } } } }
        '403': { description: Not an administrator, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/status:
    get:
      summary: Whether the admin agent (the privileged helper of ARMOR-DEVOPS) is installed and answering (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ available, reason }', content: { application/json: { schema: { $ref: '#/components/schemas/AdminAvailability' } } } }
  /api/v1/admin/services:
    get:
      summary: The A.R.M.O.R. services the admin agent may control, with their state (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ services }', content: { application/json: { schema: { $ref: '#/components/schemas/AdminServices' } } } }
        '503': { description: The admin agent is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/services/{id}/{action}:
    post:
      summary: Start, stop, restart, reload, pause or resume one of those services (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: action, in: path, required: true, schema: { type: string, enum: [start, stop, restart, reload, pause, resume] } }]
      responses:
        '200': { description: Done, content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
        '404': { description: Not one of the services, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '503': { description: The admin agent is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/files:
    get:
      summary: The settings files the admin agent may read and write (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ files }', content: { application/json: { schema: { $ref: '#/components/schemas/AdminFiles' } } } }
  /api/v1/admin/files/{id}:
    get:
      summary: One settings file; in an environment file the value of every secret is replaced by a mask (an administrator)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ id, path, format, content, mtime, masked }', content: { application/json: { schema: { $ref: '#/components/schemas/AdminFile' } } } }
        '404': { description: Not one of the files, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    put:
      summary: Save one settings file (a masked line keeps its real value), optionally restarting the services that read it; the old file is kept as a copy (an administrator)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutAdminFilesIdRequest' } } } }
      responses:
        '200': { description: '{ ok, restarted }', content: { application/json: { schema: { $ref: '#/components/schemas/AdminFileSaved' } } } }
        '409': { description: The file changed since it was read, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: The content is not valid for this kind of file, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/mqtt/accounts:
    get:
      summary: The accounts of the A.R.M.O.R. MQTT broker, with their role and what each may read and write (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ accounts }', content: { application/json: { schema: { $ref: '#/components/schemas/MqttAccounts' } } } }
    post:
      summary: Make the account of a node, a device or a consumer; the password is returned once and kept only hashed (an administrator)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminMqttAccountsRequest' } } } }
      responses:
        '200': { description: '{ ok, user, password }', content: { application/json: { schema: { $ref: '#/components/schemas/MqttAccountCreated' } } } }
        '409': { description: The account exists, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/mqtt/accounts/{user}:
    delete:
      summary: Remove an account (never the server's own) (an administrator)
      security: [{ admin: [] }]
      parameters: [{ name: user, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Removed, content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
  /api/v1/admin/nodes/provision:
    post:
      summary: Adopt a field node in one step - make (or renew) its broker account and write the broker and that account into the node's own panel with the login given, which is used once and never kept (an administrator)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminNodesProvisionRequest' } } } }
      responses:
        '200': { description: '{ ok, written, why, broker } - written is false when the panel could not be written to; broker then holds what to type by hand', content: { application/json: { schema: { $ref: '#/components/schemas/NodeProvisioned' } } } }
        '422': { description: Not a node id or a local address, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/firmware/uploads:
    post:
      summary: Keep a firmware image (the .bin of a node project, as application/octet-stream, at most 4 MB) for a firmware job; kept for an hour (an administrator)
      security: [{ admin: [] }]
      responses:
        '201': { description: '{ id, name, bytes, sha256 }', content: { application/json: { schema: { $ref: '#/components/schemas/FirmwareUpload' } } } }
        '415': { description: Not sent as application/octet-stream, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: 'Not an image of an ESP32 application, or of a size that makes sense; or an image for another kind of node (code wrong_image_kind, wrong_node_kind)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/installation:
    get:
      summary: The whole installation as one file - the cameras (without their passwords), the designs of the site, the electricity and the network, the rules, the automations, the devices, the solar equipment, the energy alarm levels and, for the record, the users' names and roles; never a password, token or key (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ format: armor-installation, version, exported_at, exported_by, parts }, sent as a download', content: { application/json: { schema: { $ref: '#/components/schemas/InstallationBundle' } } } }
    post:
      summary: Import an installation file. The designs, the rules and the energy alarm levels replace what is there (the designs keep their previous version); the cameras, automations, devices and solar equipment only add what is missing; the users are never imported. A part that does not check out is reported and skipped without spoiling the others (an administrator)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminInstallationRequest' } } } }
      responses:
        '200': { description: '{ applied, skipped, failed, cameras_need_credentials } - what was done, part by part', content: { application/json: { schema: { $ref: '#/components/schemas/InstallationReport' } } } }
        '400': { description: 'Not an installation file, or none of the parts asked for is known', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/firmware/releases/{kind}:
    get:
      summary: The newest release of the repository of a kind of node (radar, solar, electrical, alarm, hmi), downloaded and checked against the SHA-256 the release publishes (an administrator)
      security: [{ admin: [] }]
      parameters: [{ name: kind, in: path, required: true, schema: { type: string, enum: [radar, solar, electrical, alarm, hmi] } }]
      responses:
        '200': { description: '{ kind, repo, version, bytes, checksum }', content: { application/json: { schema: { $ref: '#/components/schemas/FirmwareRelease' } } } }
        '404': { description: 'Unknown kind, or the repository has no release', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '422': { description: 'The release has no image or no hash file, or the image does not match its hash', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: GitHub could not be reached, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/firmware/probe:
    post:
      summary: Ask nodes (by local address) what they say about themselves without a login - id, version and board (an administrator)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminFirmwareProbeRequest' } } } }
      responses:
        '200': { description: '{ nodes: [{ address, reachable, node_id?, version?, board? }] }', content: { application/json: { schema: { $ref: '#/components/schemas/FirmwareProbe' } } } }
        '422': { description: Not a local address, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/firmware/jobs:
    post:
      summary: Update the firmware of one or more nodes of one kind, one at a time, from an uploaded image or the newest GitHub release, with the login of the nodes' own panel (used for the job, never kept) (an administrator)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminFirmwareJobsRequest' } } } }
      responses:
        '202': { description: '{ id } - the job runs in the background', content: { application/json: { schema: { $ref: '#/components/schemas/JobStarted' } } } }
        '409': { description: Another job is running, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: 'Unknown kind or source, not a local address, no login, or an unknown upload', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/firmware/jobs/{id}:
    get:
      summary: How a firmware job stands - its state and, for every node, where it is and the version before and after (an administrator)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { description: Unknown job, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/admin/notifications:
    get:
      summary: Which places the alarms are sent to - webhook, MQTT, Telegram, Home Assistant - and the language of their sentences (never their secrets) (an administrator)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ webhook, mqtt, telegram, homeassistant, language }', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationChannels' } } } }
  /api/v1/admin/notifications/test:
    post:
      summary: Send one test message to every place the alarms go (or to the one in `channel`), once, and say what each answered (an administrator)
      security: [{ admin: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminNotificationsTestRequest' } } } }
      responses:
        '200': { description: '{ results: [{ channel, ok, detail }] }', content: { application/json: { schema: { $ref: '#/components/schemas/NotificationTest' } } } }
        '409': { description: Nothing is configured, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: Unknown channel, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/maintenance/status:
    get:
      summary: Whether the maintenance helper (the root helper of ARMOR-DEVOPS that updates the programs and the system) is installed, and whether its console is on (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ available, console, reason }', content: { application/json: { schema: { $ref: '#/components/schemas/AdminAvailability' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/updates:
    get:
      summary: The programs of the machine with the version installed, the newest release on GitHub, a state for each, the operating system and the last operations (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ components, system, running, history }', content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      summary: Update, reinstall or check programs from GitHub releases (hash checked, previous version kept), or the operating system (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminUpdatesRequest' } } } }
      responses:
        '202': { description: '{ id } - the job runs in the background', content: { application/json: { schema: { $ref: '#/components/schemas/JobStarted' } } } }
        '409': { description: Another job is running, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/updates/{id}/rollback:
    post:
      summary: Put one program back to the version it had before its last update (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '202': { description: '{ id }', content: { application/json: { schema: { $ref: '#/components/schemas/JobStarted' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/updates/history:
    delete:
      summary: Empty the list of the last operations (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '200': { description: Emptied, content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/system/check:
    post:
      summary: Look for updates of the operating system (apt-get update) (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '202': { description: '{ id } - the job runs in the background', content: { application/json: { schema: { $ref: '#/components/schemas/JobStarted' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/system/upgrade:
    post:
      summary: Upgrade the operating system - `upgrade` (default), `full` (full-upgrade, what a plain upgrade keeps back) or `repair` (finish half-installed packages and fix dependencies) (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminSystemUpgradeRequest' } } } }
      responses:
        '202': { description: '{ id } - the job runs in the background', content: { application/json: { schema: { $ref: '#/components/schemas/JobStarted' } } } }
        '422': { description: Unknown mode, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/system/reboot:
    post:
      summary: Reboot the machine (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '202': { description: Rebooting, content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/nodes/{id}/token:
    get:
      summary: The token of one node - HMAC of the shared ingest token with the node id, good only for that node - to provision a board (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: '{ node_id, token, strict }', content: { application/json: { schema: { $ref: '#/components/schemas/NodeToken' } } } }
        '422': { description: Not a valid node id, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/maintenance/jobs/{id}:
    get:
      summary: How a maintenance job stands - its steps, percent and the log from a given line (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { description: Unknown job, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/console:
    get:
      summary: The state of the root console - on or off, locked or unlocked (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ enabled, unlocked, locked_until }', content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleState' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/console/unlock:
    post:
      summary: Unlock the root console with the administrator's password, for ten minutes; five wrong passwords close it for five minutes (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminConsoleUnlockRequest' } } } }
      responses:
        '200': { description: Unlocked, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleUnlocked' } } } }
        '401': { description: Wrong password, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '423': { description: Too many failures, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/console/lock:
    post:
      summary: Lock the root console again (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      responses:
        '200': { description: Locked, content: { application/json: { schema: { $ref: '#/components/schemas/ConsoleUnlocked' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/console/run:
    post:
      summary: Run one command as root with a time limit and a folder (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminConsoleRunRequest' } } } }
      responses:
        '202': { description: '{ id }', content: { application/json: { schema: { $ref: '#/components/schemas/JobStarted' } } } }
        '403': { description: The console is off or locked, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/console/jobs/{id}:
    get:
      summary: The output of a console command from a given offset, and whether it ended (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The job, content: { application/json: { schema: { $ref: '#/components/schemas/Job' } } } }
        '404': { description: Unknown job, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/console/jobs/{id}/cancel:
    post:
      summary: Stop a running console command (an administrator; written in the audit trail)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: Stopped, content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
        '503': { description: The maintenance helper is not installed or not answering, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/ai/context:
    get:
      summary: 'For the observation service (ARMOR-SERVER-AI, with its own token): the mode, the radar nodes with their tracks and light, and the cameras it can look at'
      security: [{ aiBearer: [] }]
      responses:
        '200': { description: '{ mode, nodes: [{ id, online, targets, lux }], cameras: [{ id, name }] }', content: { application/json: { schema: { $ref: '#/components/schemas/AiContext' } } } }
        '401': { description: Not the observation service token, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/ai/cameras/{id}/frame:
    get:
      summary: For the observation service - one grey frame of a camera, 64 x 36 bytes taken from its stream and never stored; what goes wrong is told without the camera's address or password
      security: [{ aiBearer: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'application/octet-stream, 2304 bytes, headers X-Frame-Width and X-Frame-Height', content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '404': { description: Unknown camera, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '502': { description: The camera did not answer, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/ai/observations:
    post:
      summary: For the observation service - what it saw (movement on a camera, with the radar tracks and the light profile); it raises an alarm only while the system is armed, once until it is closed
      security: [{ aiBearer: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAiObservationsRequest' } } } }
      responses:
        '200': { description: '{ raised, alarm_id?, reason? }', content: { application/json: { schema: { $ref: '#/components/schemas/AiObservationResult' } } } }
        '404': { description: Unknown camera, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '422': { description: Not a valid observation, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/voice/status:
    get:
      summary: Whether written and spoken commands are available on this install (a voice gateway is set up)
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ available }', content: { application/json: { schema: { $ref: '#/components/schemas/VoiceStatus' } } } }
  /api/v1/alarm-audio:
    get:
      summary: What the sound of an alarm offers on this server - whether the spoken alarm and the uploaded sounds are on (two options of the security settings, both off by default), whether a voice gateway is set up, the limits of a sound and the sounds stored
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ spoken, custom }', content: { application/json: { schema: { $ref: '#/components/schemas/AlarmAudioState' } } } }
  /api/v1/alarm-audio/spoken:
    get:
      summary: An alarm said out loud - the sentence (origin, severity and what the alarm code means, in the language asked) made by the voice gateway and kept in a cache; answers 16 kHz 16-bit mono PCM. The wall panel may call it. Off (404) until the option alarm_audio.spoken is turned on
      security: [{ operator: [] }]
      parameters:
        - { name: language, in: query, required: true, schema: { type: string, enum: [en, es, de, fr, it, ja, zh, pt] } }
        - { name: source, in: query, required: true, schema: { $ref: '#/components/schemas/AlarmAudioSource' } }
        - { name: severity, in: query, required: true, schema: { type: string, enum: [critical, high, warning, info] } }
        - { name: code, in: query, required: false, description: 'The alarm code; a code the server does not know is not read out', schema: { type: string, pattern: '^[a-z0-9][a-z0-9_.:-]{0,63}$' } }
      responses:
        '200':
          description: The samples of the sentence
          headers: { X-Armor-Audio-Sha256: { description: 'SHA-256 of the samples, in hexadecimal (also the ETag)', schema: { type: string, pattern: '^[0-9a-f]{64}$' } } }
          content:
            'audio/L16;rate=16000': { schema: { type: string, format: binary } }
        '404': { description: 'The option alarm_audio.spoken is off (spoken_alarms_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: 'A language, origin, severity or code that is not one of the closed lists', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: 'The voice gateway answered something that is not audio of the right size (voice_bad_answer)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'No voice gateway is set up, it has no speech engine (tts_unavailable) or it does not answer', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/alarm-audio/sounds/{source}:
    parameters:
      - { name: source, in: path, required: true, schema: { $ref: '#/components/schemas/AlarmAudioSource' } }
    get:
      summary: The sound an administrator uploaded for an origin of alarm, as 16 kHz 16-bit mono PCM. The wall panel may call it. Off (404) until the option alarm_audio.custom_sounds is turned on; 304 when the panel already has these samples (If-None-Match)
      security: [{ operator: [] }]
      responses:
        '200':
          description: The samples
          headers: { X-Armor-Audio-Sha256: { description: 'SHA-256 of the samples, in hexadecimal (also the ETag)', schema: { type: string, pattern: '^[0-9a-f]{64}$' } } }
          content:
            'audio/L16;rate=16000': { schema: { type: string, format: binary } }
        '304': { description: The panel holds exactly these samples, content: { text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '404': { description: 'No sound for that origin, or the option is off (custom_sounds_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    put:
      summary: Stores the sound for an origin (administrator; asks for the proof of identity again from outside the house). The body is a WAVE file of 16 kHz, 16-bit, mono PCM, longer than a tenth of a second and not longer than the limit (ARMOR_ALARM_SOUND_MAX_BYTES, 4 seconds by default); only its samples are kept. Refused with 409 while the option alarm_audio.custom_sounds is off
      security: [{ admin: [] }]
      requestBody:
        required: true
        content:
          audio/wav: { schema: { type: string, format: binary } }
      responses:
        '200': { description: What was stored, content: { application/json: { schema: { $ref: '#/components/schemas/AlarmAudioSound' } } } }
        '401': { description: 'Not signed in', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is needed again', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'Not one of the six origins (unknown_source)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'The option alarm_audio.custom_sounds is off (custom_sounds_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '411': { description: 'No body (no_sound)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '413': { description: 'More than the limit (sound_too_long)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '415': { description: 'Not a WAVE file of 16 kHz, 16-bit, mono PCM (not_a_wave_file, wave_truncated, wave_unreadable, unsupported_wave_format)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: 'Shorter than a tenth of a second (sound_too_short) or silence (sound_is_silent)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      summary: Takes the sound of an origin away (administrator; allowed with the option off as well)
      security: [{ admin: [] }]
      responses:
        '200': { description: '{ removed }', content: { application/json: { schema: { $ref: '#/components/schemas/AlarmAudioRemoved' } } } }
        '401': { description: 'Not signed in', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Not an administrator, or the proof of identity is needed again', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'There was no sound for that origin', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/voice/command:
    post:
      summary: A written or spoken command (as text) - the voice gateway says which of its closed commands it is (arm, disarm, status, silence, alarms, nodes, cameras, radar, solar, electrical, network, time, help, lights on, lights off) and this server carries out what was accepted, with the session of the person; arm and disarm need a second turn with the confirmation token
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostVoiceCommandRequest' } } } }
      responses:
        '200': { description: '{ accepted, executed, intent, outcome, speech, confirmation_token?, reason?, result? } - outcome is accepted, confirmation-needed, confirmation-refused or not-understood', content: { application/json: { schema: { $ref: '#/components/schemas/VoiceCommandResult' } } } }
        '422': { description: 'No text, too long, or not a supported language', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'No voice gateway is set up, or it does not answer', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/voice/turn:
    post:
      summary: One spoken turn from the wall panel - the audio goes to the voice gateway on this machine and its answer comes back as it is; authenticated with the voice token, not with a session
      security: []
      parameters:
        - { name: X-Armor-Voice-Token, in: header, required: true, schema: { type: string } }
        - { name: X-Armor-Language, in: header, required: false, schema: { type: string, enum: [en, es, de, fr, it, ja, zh, pt] } }
      requestBody:
        required: true
        description: 'Either the audio alone as the whole body (the older request: audio/L16;rate=16000, raw 16 kHz 16-bit mono PCM) or, when the server allows it (security option voice.multipart_turn), multipart/form-data with the parts meta (optional, application/json, VoiceTurnMeta) and audio (the same PCM as raw bytes), each at most once and nothing else. The limit of the audio is 480 000 bytes (15 seconds) unless the administrator of the server set another one (ARMOR_VOICE_TURN_MAX_BYTES, up to 1 920 000).'
        content:
          'audio/L16;rate=16000': { schema: { type: string, format: binary, maxLength: 480000 } }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/VoiceTurnForm' }
            encoding:
              meta: { contentType: application/json }
              audio: { contentType: 'audio/L16;rate=16000, application/octet-stream' }
      responses:
        '200':
          description: '{ heard, reply, audio? } - audio is base64 16 kHz 16-bit mono PCM; or, to a multipart request whose meta says reply_audio binary, multipart/mixed with the parts result (application/json, VoiceTurnResult without audio) and audio (raw PCM, at most 200 000 bytes - a longer one is left out and the result says audio_omitted)'
          content:
            application/json: { schema: { $ref: '#/components/schemas/VoiceTurn' } }
            multipart/mixed: { schema: { type: string, format: binary } }
        '400': { description: 'The multipart framing is wrong (boundary, part headers, closing delimiter)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: 'The voice token is wrong', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '411': { description: 'No audio, or an audio of an odd number of bytes in a multipart request', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '413': { description: 'More audio than the limit of the server (480 000 bytes, 15 seconds, by default)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '415': { description: 'The audio part is not 16 kHz PCM (unsupported_audio_type), or the server does not take multipart turns (multipart_turn_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '422': { description: 'A part that is not meta or audio (unknown_part), a part twice (duplicate_part), no audio (missing_audio) or a meta that is not VoiceTurnMeta (bad_meta)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: 'The voice gateway answered something that is not a voice reply', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '503': { description: 'No voice gateway is set up, or it does not answer', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/voice/v1/turn:
    post:
      summary: The same as /api/v1/voice/turn, at the path a panel builds when its voice address is this server plus /api/v1/voice
      security: []
      requestBody: { required: true, description: 'See /api/v1/voice/turn', content: { 'audio/L16;rate=16000': { schema: { type: string, format: binary } }, multipart/form-data: { schema: { $ref: '#/components/schemas/VoiceTurnForm' } } } }
      responses:
        '200': { description: 'See /api/v1/voice/turn', content: { application/json: { schema: { $ref: '#/components/schemas/VoiceTurn' } }, multipart/mixed: { schema: { type: string, format: binary } } } }
  /api/v1/studio/session/totp:
    post:
      security: []
      summary: The second step of the sign-in - the challenge the first step gave and a code of the authenticator app (or a recovery code); the session cookie is set only now
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostStudioSessionTotpRequest' } } } }
      responses:
        '201': { description: 'Signed in: { expiresAt, user }', content: { application/json: { schema: { $ref: '#/components/schemas/StudioSessionOpened' } } } }
        '401': { description: 'The code is not right, or the challenge expired (code bad_code or challenge_expired)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '429': { description: 'Too many wrong codes (code totp_locked)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/studio/sessions:
    get:
      security: [{ studio: [] }]
      summary: The sessions of the signed-in person (when, from where - local or remote -, which browser), the current one marked
      responses:
        '200': { description: '{ sessions: [{ id, created, last_seen, origin, ip, agent, current }] }', content: { application/json: { schema: { $ref: '#/components/schemas/StudioSessionList' } } } }
  /api/v1/studio/sessions/{id}:
    delete:
      security: [{ studio: [] }]
      summary: End one session of the person by its short id
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 'Ended' }
        '404': { description: 'No such session', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/studio/sessions/end-others:
    post:
      security: [{ studio: [] }]
      summary: End every session of the person except this one
      responses:
        '204': { description: 'Ended' }
  /api/v1/studio/elevate:
    post:
      security: [{ studio: [] }]
      summary: A new proof of identity (the password, or a code when the second factor is on and the session is remote) that lets critical actions through for a few minutes
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostStudioElevateRequest' } } } }
      responses:
        '200': { description: '{ elevated_for_s }', content: { application/json: { schema: { $ref: '#/components/schemas/Elevated' } } } }
        '401': { description: 'Not right (code bad_proof)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/studio/totp:
    get:
      security: [{ studio: [] }]
      summary: Whether the second factor is on for the person, how many recovery codes are left, and the policy of the server
      responses:
        '200': { description: '{ enabled, recovery_left, policy }', content: { application/json: { schema: { $ref: '#/components/schemas/TotpState' } } } }
    delete:
      security: [{ studio: [] }]
      summary: Turn the second factor off (needs the password); the other sessions end
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteStudioTotpRequest' } } } }
      responses:
        '204': { description: 'Off' }
        '401': { description: 'The password is not right', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/studio/totp/setup:
    post:
      security: [{ studio: [] }]
      summary: Start the second factor - needs the password; answers the secret and the otpauth address (a QR for the authenticator app)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostStudioTotpSetupRequest' } } } }
      responses:
        '200': { description: '{ secret, uri }', content: { application/json: { schema: { $ref: '#/components/schemas/TotpSetup' } } } }
        '401': { description: 'The password is not right', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'Already on', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/studio/totp/enable:
    post:
      security: [{ studio: [] }]
      summary: Confirm the second factor with the first code of the app; answers the ten recovery codes, shown once
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostStudioTotpEnableRequest' } } } }
      responses:
        '200': { description: '{ enabled: true, recovery_codes }', content: { application/json: { schema: { $ref: '#/components/schemas/TotpEnabled' } } } }
        '401': { description: 'The code is not right', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/users/{id}/totp:
    delete:
      security: [{ admin: [] }]
      summary: An administrator turns off the second factor of a user who lost the phone and the recovery codes
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '204': { description: 'Off' }
        '404': { description: 'No such user', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/remote/check:
    get:
      security: [{ admin: [] }]
      summary: What the server sees of this request - the address, whether it counts as local or remote, whether the cookie is Secure, the proxy setting, the policy - to check a remote set-up from a phone on mobile data
      responses:
        '200': { description: '{ ip, origin, session_origin, protocol, forwarded_for, cookie_secure, trust_proxy, totp_policy, totp_enabled, remote_session_ttl_s, remote_idle_s, elevation_s }', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteCheck' } } } }
  /api/v1/nodes/{nodeId}/panel/{path}:
    parameters:
      - { name: nodeId, in: path, required: true, schema: { type: string } }
      - { name: path, in: path, required: true, schema: { type: string } }
    get:
      security: [{ admin: [] }]
      summary: The web panel of a field node, through the server (administrators; from outside the house a new proof of identity opens it). The address of the node comes from /api/v1/admin/node-panels, never from the request; the cookie of the node stays on the server
      responses:
        '200': { description: 'What the node answered, with the server''s own security headers', content: { '*/*': { schema: { type: string, format: binary, description: 'The body the node answered, as it is' } } } }
        '400': { description: 'Bad path (code bad_path)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'Elevation needed, or only from the house or the VPN (code remote_policy)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: 'The panel is not registered', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: 'The certificate of the node is not trusted yet (code not_pinned)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '502': { description: 'The node does not answer, or shows another certificate (code fingerprint_mismatch)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    post:
      security: [{ admin: [] }]
      summary: A write to the panel of a node (written in the audit trail, without its content); the same rules as the read, bodies up to 64 KB (8 MB for the firmware and the settings import)
      responses:
        '200': { description: 'What the node answered', content: { '*/*': { schema: { type: string, format: binary, description: 'The body the node answered, as it is' } } } }
        '413': { description: 'Too large', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    put:
      security: [{ admin: [] }]
      summary: Same as post
      responses:
        '200': { description: What the node answered, content: { '*/*': { schema: { type: string, format: binary, description: 'The body the node answered, as it is' } } } }
    delete:
      security: [{ admin: [] }]
      summary: Same as post
      responses:
        '200': { description: What the node answered, content: { '*/*': { schema: { type: string, format: binary, description: 'The body the node answered, as it is' } } } }
  /api/v1/admin/node-panels:
    get:
      security: [{ admin: [] }]
      summary: The nodes whose panel can be opened through the server (administrators)
      responses:
        '200': { description: '{ panels: [{ id, address, scheme, port, fingerprint?, label? }] }', content: { application/json: { schema: { $ref: '#/components/schemas/NodePanelList' } } } }
  /api/v1/admin/node-panels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    put:
      security: [{ admin: [] }]
      summary: Register or change a node panel - an address of the house (10/8, 172.16/12, 192.168/16), http or https; changing the address forgets the trusted certificate
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutAdminNodePanelsIdRequest' } } } }
      responses:
        '200': { description: 'The panel as kept', content: { application/json: { schema: { $ref: '#/components/schemas/NodePanel' } } } }
        '422': { description: 'Not valid (code invalid_panel)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    delete:
      security: [{ admin: [] }]
      summary: Take a node panel off the list
      responses:
        '204': { description: 'Removed' }
  /api/v1/admin/node-panels/{id}/fingerprint:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      security: [{ admin: [] }]
      summary: Look at the certificate the node shows (SHA-256) and, with trust true, remember it as the one to demand
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminNodePanelsIdFingerprintRequest' } } } }
      responses:
        '200': { description: '{ fingerprint, trusted, previous, changed }', content: { application/json: { schema: { $ref: '#/components/schemas/NodePanelFingerprint' } } } }
        '502': { description: 'The node does not answer', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/remote:
    get:
      security: [{ admin: [] }]
      summary: The state of the way in from outside the house - the VPN (WireGuard - set up or not, running, devices) and the dynamic DNS name - as the maintenance agent reports it, with no key and no token
      responses:
        '200': { description: '{ wireguard: { tool, script, configured, running, qr, peers, endpoint?, subnet?, port?, lan?, route_lan? }, ddns: { script, configured, provider?, name?, last_address? } }', content: { application/json: { schema: { $ref: '#/components/schemas/RemoteState' } } } }
        '503': { description: 'The maintenance agent is not there', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/remote/tls:
    get:
      security: [{ admin: [] }]
      summary: 'The key of the authority that signs the installation''s own HTTPS, as a phone pins it, and the text that pairs a phone with it (an administrator; a hash of a public key, no secret)'
      parameters:
        - { name: host, in: query, required: false, schema: { type: string, maxLength: 253 }, description: 'The name the phone reaches the house by; it goes into the text (armor-pin:<host>:<pin>)' }
      responses:
        '200': { description: The authority and its pin, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteTls' } } } }
        '503': { description: The maintenance agent is not there, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/remote/wireguard/setup:
    post:
      security: [{ admin: [] }]
      summary: Set up the VPN (a new proof of identity from outside)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminRemoteWireguardSetupRequest' } } } }
      responses:
        '200': { description: 'The state', content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
        '422': { description: 'Not valid', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/admin/remote/wireguard/peers:
    post:
      security: [{ admin: [] }]
      summary: Add a device to the VPN and get its configuration (it holds a private key; never cached)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminRemoteWireguardPeersRequest' } } } }
      responses:
        '201': { description: '{ name, config, qr_svg }', content: { application/json: { schema: { $ref: '#/components/schemas/WireguardPeer' } } } }
  /api/v1/admin/remote/wireguard/peers/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    get:
      security: [{ admin: [] }]
      summary: The configuration of a device again
      responses:
        '200': { description: '{ name, config, qr_svg }', content: { application/json: { schema: { $ref: '#/components/schemas/WireguardPeer' } } } }
    delete:
      security: [{ admin: [] }]
      summary: Take a device off the VPN
      responses:
        '200': { description: '{ ok }', content: { application/json: { schema: { $ref: '#/components/schemas/Ok' } } } }
  /api/v1/admin/remote/ddns/setup:
    post:
      security: [{ admin: [] }]
      summary: Keep a name pointing at the house (DuckDNS, Cloudflare or any address to call); the token is not written in the audit trail
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostAdminRemoteDdnsSetupRequest' } } } }
      responses:
        '200': { description: 'The state', content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
  /api/v1/admin/remote/ddns/update:
    post:
      security: [{ admin: [] }]
      summary: Tell the provider the current address now
      responses:
        '200': { description: 'The state', content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
  /api/v1/admin/remote/ddns/remove:
    post:
      security: [{ admin: [] }]
      summary: Stop updating the name
      responses:
        '200': { description: 'The state', content: { application/json: { schema: { $ref: '#/components/schemas/AgentReply' } } } }
  /api/v1/operator/session:
    post:
      summary: Exchange the operator token for a session cookie
      security: [{ operatorBearer: [] }]
      responses:
        '201': { description: Session opened, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorSessionOpened' } } } }
        '401': { description: Authentication failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Close the operator session
      security: [{ operator: [] }]
      responses:
        '204': { description: Session closed }
  /api/v1/camera-views:
    get:
      summary: 'Cameras without username or credentials (an operator only: it holds the inventory of the cameras)'
      security: [{ operator: [] }]
      responses:
        '200': { description: Camera views, content: { application/json: { schema: { $ref: '#/components/schemas/CameraViewList' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/cameras:
    get:
      summary: Cameras with username and credential flags (never the password)
      security: [{ operator: [] }]
      responses:
        '200': { description: Cameras, content: { application/json: { schema: { $ref: '#/components/schemas/CameraList' } } } }
        '401': { description: Operator required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/cameras/configure:
    post:
      summary: Create or update a camera connection
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CameraInput' } } } }
      responses:
        '200': { description: Stored camera, content: { application/json: { schema: { $ref: '#/components/schemas/Camera' } } } }
        '400': { description: Invalid configuration, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/cameras/discover:
    post:
      summary: Probe one private /24 for camera services (one scan at a time)
      security: [{ operator: [] }]
      responses:
        '200': { description: Discovered hosts and the networks scanned, content: { application/json: { schema: { $ref: '#/components/schemas/CameraDiscovery' } } } }
        '429': { description: A discovery is already running, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}:
    delete:
      summary: Remove a camera connection (evidence is kept)
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '204': { description: Removed }
        '404': { description: Unknown camera, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '409': { description: A recording is active, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/ptz:
    post:
      description: A move is continuous on most cameras, so the server stops it by itself about 2.5 s after the last move; a client holding a button repeats the move every second and sends `stop` on release. The error says why a move failed (login refused, camera silent, no PTZ support).
      summary: Bounded PTZ movement (Hi3510, PSIA, then ONVIF)
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PtzCommand' } } } }
      responses:
        '200': { description: Command sent, content: { application/json: { schema: { $ref: '#/components/schemas/PtzResult' } } } }
        '502': { description: Camera refused or is unreachable, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/discover-rtsp:
    post:
      summary: Test common RTSP paths with authenticated DESCRIBE
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '200': { description: Paths that answered 200, content: { application/json: { schema: { $ref: '#/components/schemas/RtspDiscovery' } } } }
        '409': { description: Credentials are incomplete, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/stream-ticket:
    post:
      summary: Issue a five-minute stream ticket bound to this camera, for the normal picture or the lighter one (fewer and narrower pictures, for a slow link)
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/PostCamerasIdStreamTicketRequest' } } } }
      responses:
        '422': { description: A quality that does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '201': { description: Stream path with ticket and the quality granted, content: { application/json: { schema: { $ref: '#/components/schemas/StreamTicket' } } } }
  /api/v1/cameras/{id}/mjpeg:
    get:
      security: [{ streamTicket: [] }]
      summary: Live MJPEG (needs an operator or a ticket for this camera)
      parameters:
        - $ref: '#/components/parameters/CameraId'
        - { name: ticket, in: query, required: false, schema: { type: string } }
        - { name: quality, in: query, required: false, schema: { type: string, enum: [normal, low] }, description: 'Only for an operator who skips the ticket: low asks for the lighter picture; a ticket carries the quality it was issued with' }
      responses:
        '200': { description: multipart/x-mixed-replace stream, content: { multipart/x-mixed-replace: { schema: { type: string, format: binary } } } }
        '401': { description: Neither an operator nor a valid ticket, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '503': { description: FFmpeg not configured or relay capacity exhausted, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/preview-ticket:
    post:
      summary: Issue a five-minute ticket bound to this camera for its still picture (the snapshot address, fetched by the server with the camera's login)
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '201': { description: Picture path with the ticket, content: { application/json: { schema: { $ref: '#/components/schemas/PreviewTicket' } } } }
        '422': { description: The camera has no snapshot address, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/preview:
    get:
      security: [{ streamTicket: [] }]
      summary: The still picture of the camera (needs an operator or a ticket for this camera)
      parameters:
        - $ref: '#/components/parameters/CameraId'
        - { name: ticket, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: A JPEG or PNG picture, content: { image/jpeg: { schema: { type: string, format: binary } }, image/png: { schema: { type: string, format: binary } } } }
        '401': { description: Neither an operator nor a valid ticket, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: No such camera, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '502': { description: 'The camera did not give a picture: no valid snapshot address, login refused or no answer', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/snapshot:
    post:
      summary: Capture a JPEG
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '201': { description: Evidence item, content: { application/json: { schema: { $ref: '#/components/schemas/MediaItemResult' } } } }
        '502': { description: Capture failed, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/recordings/start:
    post:
      summary: Start an MP4 recording
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '202': { description: Recording started, content: { application/json: { schema: { $ref: '#/components/schemas/RecordingStarted' } } } }
        '502': { description: Could not start, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/cameras/{id}/recordings/stop:
    post:
      summary: Stop and finalize the recording
      security: [{ operator: [] }]
      parameters: [{ $ref: '#/components/parameters/CameraId' }]
      responses:
        '200': { description: Finished evidence item, content: { application/json: { schema: { $ref: '#/components/schemas/MediaItemResult' } } } }
        '409': { description: Not recording, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/media:
    get:
      summary: Evidence catalogue, newest first
      security: [{ operator: [] }]
      responses:
        '200': { description: Items and the cameras currently recording, content: { application/json: { schema: { $ref: '#/components/schemas/MediaList' } } } }
    delete:
      summary: Delete every unprotected item of a kind
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeleteMediaRequest' } } } }
      responses:
        '200': { description: Number deleted, content: { application/json: { schema: { $ref: '#/components/schemas/Count' } } } }
        '400': { description: Unknown kind, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/media/{cameraId}/{kind}/{file}:
    parameters: [{ $ref: '#/components/parameters/MediaCamera' }, { $ref: '#/components/parameters/MediaKind' }, { $ref: '#/components/parameters/MediaFile' }]
    get:
      summary: Download or play one item
      security: [{ operator: [] }]
      responses:
        '200': { description: image/jpeg or video/mp4, content: { image/jpeg: { schema: { type: string, format: binary } }, video/mp4: { schema: { type: string, format: binary } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Delete one item (refused while protected)
      security: [{ operator: [] }]
      responses:
        '204': { description: Deleted }
        '409': { description: Protected, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/media/{cameraId}/{kind}/{file}/sha256:
    parameters: [{ $ref: '#/components/parameters/MediaCamera' }, { $ref: '#/components/parameters/MediaKind' }, { $ref: '#/components/parameters/MediaFile' }]
    get:
      summary: SHA-256 of the file as stored, for chain of custody
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ "sha256": hex }', content: { application/json: { schema: { $ref: '#/components/schemas/MediaDigest' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/media/{cameraId}/{kind}/{file}/proof:
    parameters: [{ $ref: '#/components/parameters/MediaCamera' }, { $ref: '#/components/parameters/MediaKind' }, { $ref: '#/components/parameters/MediaFile' }]
    get:
      summary: A signed proof of custody of one file - its size, its SHA-256 now, when it was made and every line of the audit trail about it - to hand over with the file
      security: [{ operator: [] }]
      responses:
        '200': { description: '{ version, issued_at, issuer, file, custody, signature }', content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceProof' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/media/proof/verify:
    post:
      summary: Whether a proof of custody is exactly what this server signed and whether the file still has the digest it names
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceProof' } } } }
      responses:
        '200': { description: '{ "genuine": boolean, "matches": boolean, "issued_at"? }', content: { application/json: { schema: { $ref: '#/components/schemas/EvidenceVerdict' } } } }
  /api/v1/media/{cameraId}/{kind}/{file}/protected:
    parameters: [{ $ref: '#/components/parameters/MediaCamera' }, { $ref: '#/components/parameters/MediaKind' }, { $ref: '#/components/parameters/MediaFile' }]
    put:
      summary: Protect or unprotect an item from automatic pruning
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PutMediaCameraIdKindFileProtectedRequest' } } } }
      responses:
        '204': { description: Updated }
        '400': { description: protected must be a boolean, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/history:
    get:
      security: [{ operator: [] }]
      summary: Event history, newest first (operator)
      description: Alert-level, node-status, camera, device, alarm and security-mode changes, and the connections of clients (Studio sessions, the Android app, the panels of nodes, the voice service) and the events of the system (nodes that appear or disappear, the broker, settings, services, updates, arming, backups). `before` is an event id; use `next_before` to page. The address and the user agent of a connection are in the answer for an administrator only; no password, token, cookie or PIN is ever recorded.
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
        - { name: before, in: query, schema: { type: integer, minimum: 1 } }
        - { name: after, in: query, schema: { type: integer, minimum: 1 }, description: 'Events after this id, oldest first (for a client that polls: it misses nothing); the answer carries next_after' }
        - { name: type, in: query, schema: { type: string, enum: [alert, node, camera, mode, device, alarm, connection, system] } }
        - { name: category, in: query, schema: { type: string, enum: [node, broker, settings, service, update, alarm, backup, batteries] }, description: 'Only the events of the system of this category (implies type=system)' }
        - { name: kind, in: query, schema: { type: string, enum: [studio, android, node, voice, other] }, description: 'Only the connections of this kind of client (implies type=connection)' }
        - { name: client, in: query, schema: { type: string, pattern: '^[0-9a-f]{16}$' }, description: 'Only the connections of this client (implies type=connection)' }
        - { name: user, in: query, schema: { type: string, maxLength: 60 }, description: 'Only what this user did or what happened to this user (connections and system events)' }
        - { name: node, in: query, schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,80}$' }, description: Node or camera id }
        - { name: q, in: query, schema: { type: string, maxLength: 80 }, description: Case-insensitive part of the node or camera id }
        - { name: level, in: query, schema: { type: string, enum: [normal, review, high] }, description: Alerts that moved to this level }
        - { name: since, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
      responses:
        '200': { description: A page of events, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryPage' } } } }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      security: [{ admin: [] }]
      summary: Permanently remove history (administrator, audited)
      description: Needs `confirm=delete`. `scope=all` removes every event (optionally only one `type`); `scope=older-than` removes those older than `days`.
      parameters:
        - { name: confirm, in: query, required: true, schema: { type: string, enum: [delete] } }
        - { name: scope, in: query, required: true, schema: { type: string, enum: [all, older-than] } }
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 3650 } }
        - { name: type, in: query, schema: { type: string, enum: [alert, node, camera, mode, device, alarm, connection, system] } }
      responses:
        '200': { description: How many events were removed and how many remain, content: { application/json: { schema: { $ref: '#/components/schemas/HistoryRemoved' } } } }
        '400': { description: Missing confirmation or invalid scope, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '403': { description: Only an administrator may remove history, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/nodes/{id}:
    delete:
      security: [{ operator: [] }]
      summary: Forget a decommissioned node (operator, audited)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,63}$' } }
      responses:
        '204': { description: Node removed }
        '400': { description: Invalid node id, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '404': { description: Unknown node, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/camera-status:
    get:
      security: [{ operator: [] }]
      summary: Reachability of every configured camera (operator)
      description: Seen by the watchdog with a plain TCP probe of the RTSP and ONVIF ports; a camera is offline after consecutive failed checks.
      responses:
        '200': { description: 'Status, time since it changed and consecutive failures per camera', content: { application/json: { schema: { $ref: '#/components/schemas/CameraStatusList' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/history/connections:
    get:
      security: [{ operator: [] }]
      summary: Every client the server has seen, with when it was last seen and its open sessions (operator)
      description: The Studio sessions, the Android app, the panels of the nodes, the voice service and any other client, newest first. The address and the user agent are given to an administrator only.
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [studio, android, node, voice, other] } }
        - { name: user, in: query, schema: { type: string, maxLength: 60 } }
        - { name: active, in: query, schema: { type: string, enum: ['1'] }, description: 'Only the clients with an open session' }
      responses:
        '200': { description: The clients, content: { application/json: { schema: { $ref: '#/components/schemas/ConnectionList' } } } }
        '400': { description: Invalid filter, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/history/summary:
    get:
      security: [{ operator: [] }]
      summary: Counts of the events held and of the last 24 hours (operator)
      description: The total, the span and the last 24 hours count the events the history shows by default; the connection and system events are counted apart, in `by_type`.
      responses:
        '200': { description: 'Total, by type, oldest and newest time, and last-24-hour counters', content: { application/json: { schema: { $ref: '#/components/schemas/HistorySummary' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/rules:
    get:
      security: [{ operator: [] }]
      summary: Alert rules (operator)
      responses:
        '200':
          description: Dwell time and ignore zones
          content: { application/json: { schema: { $ref: '#/components/schemas/Rules' } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    put:
      security: [{ operator: [] }]
      summary: Replace the alert rules (operator, audited)
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Rules' } } } }
      responses:
        '200': { description: Rules saved, content: { application/json: { schema: { $ref: '#/components/schemas/Rules' } } } }
        '400': { description: Invalid rules, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Operator authorization is required, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
components:
  securitySchemes:
    ingestBearer: { type: http, scheme: bearer, description: ARMOR_INGEST_TOKEN }
    controlBearer: { type: http, scheme: bearer, description: ARMOR_CONTROL_TOKEN }
    operatorBearer: { type: http, scheme: bearer, description: ARMOR_OPERATOR_TOKEN }
    aiBearer: { type: http, scheme: bearer, description: 'ARMOR_AI_TOKEN - the observation service, which opens only the /api/v1/ai routes' }
    operator: { type: apiKey, in: cookie, name: armor_studio_session, description: 'Studio session, operator session or operator bearer token' }
    diagnosticBearer: { type: http, scheme: bearer, description: 'A read-only diagnostic token (armor-diag-...) issued by an administrator with POST /api/v1/diagnostics/tokens; it opens only the four GET routes under /api/v1/diagnostics/nodes, for the nodes it names' }
    studio: { type: apiKey, in: cookie, name: armor_studio_session, description: A signed-in Studio user }
    streamTicket: { type: apiKey, in: query, name: ticket, description: 'The short-lived ticket that POST /api/v1/cameras/{id}/stream-ticket hands out for the live picture' }
    admin: { type: apiKey, in: cookie, name: armor_studio_session, description: A signed-in Studio user with the admin role (bearer tokens do not qualify) }
  parameters:
    CameraId: { name: id, in: path, required: true, schema: { type: string, pattern: '^[A-Za-z0-9._-]{3,80}$' } }
    MediaCamera:
      name: cameraId
      in: path
      required: true
      schema: { type: string }
    MediaKind:
      name: kind
      in: path
      required: true
      description: snapshots or recordings
      schema: { type: string, enum: [snapshots, recordings] }
    MediaFile:
      name: file
      in: path
      required: true
      schema: { type: string }
  schemas:
    DeviceState:
      type: object
      description: 'Canonical fields only; anything else is dropped. Booleans: triggered, open, on, locked, tamper. Numbers: temperature, humidity, battery, brightness, power_w, energy_kwh, lux, rssi, co_ppm.'
      additionalProperties: false
      properties:
        triggered: { type: boolean }
        open: { type: boolean }
        on: { type: boolean }
        locked: { type: boolean }
        tamper: { type: boolean }
        temperature: { type: number }
        humidity: { type: number }
        battery: { type: number }
        brightness: { type: number }
        power_w: { type: number }
        energy_kwh: { type: number }
        lux: { type: number }
        rssi: { type: number }
        co_ppm: { type: number }
    DeviceSource:
      description: 'Where the state of a device comes from: push (it reports with the ingest token) or mqtt (a state topic, an optional availability topic and a map from its payload to canonical fields)'
      oneOf:
        - { type: object, additionalProperties: false, required: [type], properties: { type: { const: push } } }
        - type: object
          additionalProperties: false
          required: [type, topic]
          properties:
            type: { const: mqtt }
            topic: { type: string }
            availability_topic: { type: string, description: 'A topic that says online or offline (Zigbee2MQTT, Tasmota, ESPHome)' }
            map:
              type: array
              maxItems: 12
              items: { type: object, additionalProperties: false, required: [field, path], properties: { field: { type: string }, path: { type: string, description: 'A dotted path in the payload; $ is the whole payload' }, invert: { type: boolean } } }
    DeviceCommands:
      type: object
      additionalProperties: false
      description: 'How the server switches the device: by MQTT and/or by an address on the local network'
      properties:
        mqtt: { type: object, additionalProperties: false, required: [topic], properties: { topic: { type: string }, 'on': { type: string }, 'off': { type: string }, toggle: { type: string }, assume_state: { type: boolean, description: 'Set the state as soon as the command is sent, for devices that never report back' } } }
        http: { type: object, additionalProperties: false, properties: { 'on': { type: string }, 'off': { type: string }, toggle: { type: string } }, description: URLs on the local network only }
    DeviceInput:
      type: object
      properties:
        id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{1,63}$' }
        name: { type: string, maxLength: 80 }
        kind: { type: string, enum: [smoke, co, gas, water_leak, panic_button, door, window, motion, glass_break, vibration, climate, temperature, humidity, light_level, smart_plug, smart_light, smart_switch, siren, lock, valve] }
        protocol: { type: string, enum: [wifi, bluetooth, zigbee, zwave, thread, lora, rf433, wired, other] }
        location: { type: string, maxLength: 80 }
        source: { $ref: '#/components/schemas/DeviceSource' }
        commands: { $ref: '#/components/schemas/DeviceCommands' }
        expected_interval_s: { type: integer, minimum: 0, description: Seconds of silence after which the device is offline; 0 never }
    AutomationTrigger:
      description: What starts an automation
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, device_id, field, equals]
          properties:
            type: { const: device }
            device_id: { type: string }
            field: { type: string, pattern: '^[a-z_]{2,20}$' }
            equals: { type: [boolean, number], description: 'The value to wait for; with op gt or lt, the limit' }
            op: { type: string, enum: [eq, gt, lt], default: eq, description: 'Numbers only: eq waits for the value, gt for it to go above, lt for it to go below' }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { const: alarm }
            severity: { type: string, enum: [critical, high, warning] }
            source_type: { type: string, enum: [node, camera, device, solar, electrical, network, alarm] }
            source_id: { type: string }
        - { type: object, additionalProperties: false, required: [type, mode], properties: { type: { const: mode }, mode: { type: string, enum: [armed, disarmed] } } }
    AutomationAction:
      description: What an automation does
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, device_id, command]
          properties:
            type: { const: device }
            device_id: { type: string }
            command: { type: string, enum: ['on', 'off', toggle] }
            for_s: { type: integer, minimum: 1, maximum: 3600, description: Switch back after this many seconds }
        - { type: object, additionalProperties: false, required: [type], properties: { type: { const: notify } } }
    AutomationInput:
      type: object
      properties:
        name: { type: string, maxLength: 80 }
        enabled: { type: boolean }
        when_mode: { type: string, enum: [any, armed, disarmed] }
        trigger: { $ref: '#/components/schemas/AutomationTrigger' }
        actions: { type: array, maxItems: 6, items: { $ref: '#/components/schemas/AutomationAction' } }
    NewUser:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{2,39}$' }
        password: { type: string, minLength: 8, maxLength: 200, description: 12 characters or more when the server is reachable from the network }
        role: { type: string, enum: [admin, operator], default: operator, description: An administrator also manages users }
    UserChange:
      type: object
      additionalProperties: false
      properties:
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{2,39}$' }
        password: { type: string, minLength: 8, maxLength: 200 }
        role: { type: string, enum: [admin, operator] }
    AccountChange:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword: { type: string }
        username: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._@-]{2,39}$' }
        newPassword: { type: string, minLength: 8, maxLength: 200 }
    Rules:
      type: object
      additionalProperties: false
      required: [dwell_ms, zones]
      properties:
        schema: { type: integer, enum: [1] }
        dwell_ms: { type: integer, minimum: 0, maximum: 60000, description: Time a two-target condition must persist before it is high }
        zones:
          type: array
          maxItems: 64
          items:
            type: object
            additionalProperties: false
            required: [id, name, action, x_min_mm, x_max_mm, y_min_mm, y_max_mm]
            properties:
              id: { type: string, pattern: '^[a-z0-9][a-z0-9_-]{0,39}$' }
              name: { type: string, maxLength: 80 }
              action: { type: string, enum: [ignore] }
              node_id: { type: string }
              sensor_id: { type: integer, minimum: 1, maximum: 3 }
              x_min_mm: { type: number }
              x_max_mm: { type: number }
              y_min_mm: { type: number }
              y_max_mm: { type: number }
    StudioLogin: { type: object, required: [username, password], properties: { username: { type: string }, password: { type: string } } }
    PtzCommand: { type: object, required: [command], properties: { command: { type: string, enum: [left, right, up, down, zoomIn, zoomOut, stop] } } }
    CameraInput:
      type: object
      required: [id, name, host]
      properties:
        id: { type: string, pattern: '^[A-Za-z0-9._-]{3,80}$' }
        name: { type: string, maxLength: 80 }
        host: { type: string, maxLength: 253 }
        username: { type: string }
        password: { type: string, description: Write-only; an empty value keeps the stored one }
        rtspPath: { type: string }
        snapshotUrl: { type: string }
        onvifPort: { type: integer, minimum: 1, maximum: 65535 }
        rtspPort: { type: integer, minimum: 1, maximum: 65535 }
    SystemState:
      type: object
      required: [mode, revision, nodes, updated_at]
      properties:
        mode: { type: string, enum: [armed, disarmed] }
        revision: { type: integer }
        updated_at: { type: string, format: date-time }
        nodes:
          type: object
          additionalProperties:
            type: object
            required: [node_id, online, stale, timestamp_ms, lux, target_count, alert_level, panel]
            properties:
              node_id: { type: string }
              online: { type: boolean, description: Reported online and heard from recently }
              stale: { type: boolean, description: Silent for longer than ARMOR_NODE_STALE_AFTER_S }
              timestamp_ms: { type: integer }
              lux: { type: [number, 'null'] }
              target_count: { type: integer }
              panel:
                type: [object, 'null']
                required: [name, firmware, ip, port]
                description: Where the node's own web panel is, as the node said itself in its information message; null until it has. Not stored, the node repeats it.
                properties:
                  name: { type: string }
                  firmware: { type: string }
                  ip: { type: string }
                  port: { type: integer }
              targets:
                type: array
                maxItems: 15
                description: The targets of the node's latest report, in the radar's own frame; empty until it reports and after a restart. `counted` is false inside an ignore zone.
                items:
                  type: object
                  required: [sensor_id, track_id, x_mm, y_mm, speed_mm_s, counted]
                  properties:
                    sensor_id: { type: integer }
                    track_id: { type: integer }
                    x_mm: { type: number, description: 'Sideways, millimetres' }
                    y_mm: { type: number, description: 'Forward, millimetres' }
                    speed_mm_s: { type: number }
                    counted: { type: boolean }
              alert_level: { type: string, enum: [normal, review, high] }
    ApiError:
      type: object
      examples: [{"error": "operator authorization is required"}]
      required: [error]
      description: The body of a refused request. Some routes answer a refusal with the bare status text instead (text/plain), which each such response also lists.
      properties:
        error: { type: string, description: 'What was wrong, in words' }
        code: { type: string, description: A stable code when the route has one (for example not_found) }
