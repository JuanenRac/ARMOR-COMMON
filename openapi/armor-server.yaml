        '200': { description: New system state, content: { application/json: { schema: { $ref: '#/components/schemas/SystemState' } } } }
        '401': { description: Authentication failure, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
        '404': { description: Unknown mode, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
