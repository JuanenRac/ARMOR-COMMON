        '400': { description: Invalid value, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/mode:
    post:
      summary: Arm or disarm the system from Studio (an operator); the answer is the new state of the perimeter (with the arming modes and alarm.mode_panel_sync on it also carries panel_sync, the report of the alarm panels that were asked to arm with the profile of the mode; a panel that does not confirm never makes the request fail). Disarming needs the PIN of the signed-in user when the user has one (always with ARMOR_DISARM_PIN=required); the duress PIN disarms and raises a critical alarm in silence.
      security: [{ operator: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PostModeRequest' } } } }
      responses:
        '200': { description: The new state, content: { application/json: { schema: { $ref: '#/components/schemas/SystemState' } } } }
        '400': { description: 'Unknown mode (invalid_mode), or home or night while the arming modes are off (modes_disabled)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'The PIN is not right (code wrong_pin), or the user has none and the server requires one (pin_not_set). With the arming modes on, a change to a mode that defends LESS than the current one needs the PIN like a disarm (unless alarm.mode_downgrade_pin is not_required)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '409': { description: 'The mode has no zones or sensors assigned, so it would defend nothing (no_zones_assigned); send confirm_unassigned: true to arm it anyway', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '429': { description: 'Too many wrong PINs: locked for a minute, then five, then fifteen (code pin_locked, retry_after_s)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
