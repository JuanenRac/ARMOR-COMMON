        live_video: { type: boolean, description: Only for an operator }
        mqtt: { type: boolean, description: Only for an operator }
    DesignSaved:
      type: object
      examples: [{"revision": 3, "updated_at": "2026-01-01T00:00:00.000Z", "updated_by": "admin"}]
      required: [revision, updated_at, updated_by]
      properties:
