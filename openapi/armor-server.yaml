      responses:
        '200': { description: 'The user, with hasPin and hasDuress', content: { application/json: { schema: { $ref: '#/components/schemas/PublicUser' } } } }
        '400': { description: A PIN has 4 to 10 digits; the duress PIN must differ, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '404': { description: Unknown user, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
    delete:
      summary: Remove the PIN and the duress PIN of a user (an administrator only)
      security: [{ admin: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: The user, content: { application/json: { schema: { $ref: '#/components/schemas/PublicUser' } } } }
        '404': { description: Unknown user, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } }, text/plain: { schema: { $ref: '#/components/schemas/StatusText' } } } }
  /api/v1/account/pin:
    put:
