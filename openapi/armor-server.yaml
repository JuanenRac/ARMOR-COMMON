      properties:
        settings: { $ref: '#/components/schemas/SecuritySettings' }
        stored: { $ref: '#/components/schemas/SecuritySettings' }
        defaults: { $ref: '#/components/schemas/SecuritySettings' }
        locked: { type: array, items: { type: string } }
    ZoneFeedKey:
