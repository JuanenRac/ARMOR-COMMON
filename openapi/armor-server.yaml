              counts: { type: object, additionalProperties: { type: integer }, description: How many of each kind of element that version held }
    SiteDesign:
      type: object
      required: [revision]
      description: The saved design of the house; revision 0 and a null document when none has been saved. The document is stored as the editor wrote it and its size is limited, not its shape.
      properties:
