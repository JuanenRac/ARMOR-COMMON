      properties:
        revision: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        network: { type: [object, 'null'], additionalProperties: true }
    AlarmDesign:
      type: object
      required: [revision]
      description: The saved design of the alarm panels; revision 0 and a null document when none has been saved.
      properties:
        revision: { type: integer, minimum: 0 }
        updated_at: { type: string, format: date-time }
        updated_by: { type: string }
        alarm_design: { type: [object, 'null'], additionalProperties: true }
    PublicUser:
      type: object
      examples: [{"id": "u1", "username": "admin", "role": "admin", "createdAt": "2026-01-01T00:00:00.000Z", "updatedAt": "2026-01-01T00:00:00.000Z", "hasPin": true, "hasDuress": false}]
      required: [id, username, role, createdAt, updatedAt, hasPin, hasDuress]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, operator, viewer, panel] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        hasPin: { type: boolean }
        hasDuress: { type: boolean }
    UserList:
      type: object
      required: [users, minPasswordLength]
      properties:
        users:
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/PublicUser' }
              - { type: object, required: [current], properties: { current: { type: boolean } } }
        minPasswordLength: { type: integer }
    AccountUser:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        role: { type: string, enum: [admin, operator, viewer, panel] }
    StudioSessionState:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user: { $ref: '#/components/schemas/AccountUser' }
        capabilities: { $ref: '#/components/schemas/StudioCapabilities' }
    StudioCapabilities:
      type: object
      description: What the signed-in person may do and what this server offers, so Studio and the phone show or hide from one place. The routes still check the role. A client that finds no such field (an older server) allows what the role allows, as before, and hides what needs a feature it was not told about
      required: [version, actions, features, security]
      properties:
        version: { type: integer, enum: [1] }
        actions:
          type: object
          required: [arm, disarm, acknowledge, operate, camera_control, administer, manage_users, security_settings]
          properties:
            arm: { type: boolean }
            disarm: { type: boolean }
            acknowledge: { type: boolean }
            operate: { type: boolean, description: 'Change devices, cameras, rules and the installation' }
            camera_control: { type: boolean, description: 'Move, record and take photos with the cameras' }
            administer: { type: boolean }
            manage_users: { type: boolean }
            security_settings: { type: boolean }
        features: { type: array, items: { type: string, enum: [security_settings, zone_feed_key, rtsp_tunnel, alarm_audio] }, description: The parts of this server that exist in this version }
        security:
          allOf: [{ $ref: '#/components/schemas/SecuritySettings' }, { type: object, properties: { locked: { type: array, items: { type: string }, description: The options the environment of the server fixes } } }]
    SecuritySettings:
      type: object
      additionalProperties: false
      description: 'The security options an administrator sets in Studio. The default of each is the way the server always behaved. nodes.nvs_encryption secrets = the alarm nodes keep the secrets they store (passwords, token, keys) encrypted in their flash (told in the policy message; off by default; no eFuse is burned). alarm.disarm_pin never = no PIN is asked to disarm or silence a siren (the duress PIN is untouched), if_set = asked of a user who has one, always = asked of everybody and a user without one cannot disarm (ARMOR_DISARM_PIN=required fixes it to always and wins over the setting). voice.silence_confirmation is sent to the voice service with every turn (header X-Armor-Policy). alarm.config_hash, server.zone_feed, server.zone_feed_signature and alarm.disarm_pin (left out of the message while it is if_set) reach the panels as the policy message (armor/alarm/{node_id}/policy). media.rtsp_proxy off puts the camera login in the command line of FFmpeg, visible to every user of the machine. voice.multipart_turn on lets the wall panel send a spoken turn as multipart/form-data with the audio as raw bytes (off: only the older raw request is taken and a multipart one is answered 415). network.login_secure_only on keeps the login stored for a device of the network from a node whose request did not come over TLS or from the machine of the server (off by default: any request of the node). panel.live_events on lets the wall panel listen to the WebSocket /api/v1/panel/events instead of asking the summary every few seconds (off: the panels on it are closed with 4403 and ask as before). client.device_lock is what the phone app asks of its user with the lock of the phone (fingerprint, face or the phone PIN): user = the switches of the app decide, sensitive = also before arming, disarming and unlocking, always = also to open the app; it can only raise what the person chose, and a phone without any lock is never shut out. voice.turn_max_bytes and voice.reply_audio_max_bytes are the most audio of a spoken turn and the most spoken answer handed back in the binary form, in bytes (the environment of the server is where they start)'
      properties:
        alarm.disarm_pin: { type: string, enum: [never, if_set, always], default: if_set }
        voice.silence_confirmation: { type: string, enum: ['off', pin, double_turn], default: 'off' }
        alarm.config_hash: { type: boolean, default: true }
        server.zone_feed: { type: boolean, default: true }
        server.zone_feed_signature: { type: boolean, default: true }
        media.rtsp_proxy: { type: boolean, default: true }
        network.login_secure_only: { type: boolean, default: false }
        login.country_alert: { type: boolean, default: true }
        voice.multipart_turn: { type: boolean, default: true }
        panel.live_events: { type: boolean, default: true }
        client.device_lock: { type: string, enum: [user, sensitive, always], default: user }
        nodes.nvs_encryption: { type: string, enum: ['off', secrets], default: 'off' }
        voice.turn_max_bytes: { type: integer, minimum: 3200, maximum: 1920000, default: 480000 }
        voice.reply_audio_max_bytes: { type: integer, minimum: 3200, maximum: 1000000, default: 200000 }
        alarm_audio.spoken: { type: boolean, default: false, description: 'The wall panel may ask for an alarm to be said out loud (off: 404)' }
        alarm_audio.custom_sounds: { type: boolean, default: false, description: 'Administrators may upload a sound for an alarm origin and the wall panel may ask for it (off: nothing is accepted or served)' }
    AlarmAudioSource: { type: string, enum: [device, solar, electrical, network, alarm, other], description: 'The origin of an alarm, as the wall panel names it (the source_type of the alarm; anything else is other)' }
    AlarmAudioSound:
      type: object
      required: [source, bytes, duration_ms, sha256, uploaded_at, uploaded_by]
      examples: [{ source: solar, bytes: 32000, duration_ms: 1000, sha256: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef, uploaded_at: '2000-01-01T00:00:00.000Z', uploaded_by: admin }]
      properties:
        source: { $ref: '#/components/schemas/AlarmAudioSource' }
        bytes: { type: integer, minimum: 3200 }
        duration_ms: { type: integer, minimum: 100 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        uploaded_at: { type: string, format: date-time }
        uploaded_by: { type: string }
    AlarmAudioRemoved:
      type: object
      required: [removed]
      examples: [{ removed: true }]
      properties:
        removed: { type: boolean }
    AlarmAudioState:
      type: object
      required: [spoken, custom]
      examples: [{ spoken: { enabled: false, available: false }, custom: { enabled: false, max_bytes: 128000, min_bytes: 3200, sources: [device, solar, electrical, network, alarm, other], sounds: [] } }]
      properties:
        spoken:
          type: object
          required: [enabled, available]
          properties:
            enabled: { type: boolean, description: The option alarm_audio.spoken }
            available: { type: boolean, description: A voice gateway is set up }
        custom:
          type: object
          required: [enabled, max_bytes, min_bytes, sources, sounds]
          properties:
            enabled: { type: boolean, description: The option alarm_audio.custom_sounds }
            max_bytes: { type: integer, description: 'The most samples one sound may have (ARMOR_ALARM_SOUND_MAX_BYTES)' }
            min_bytes: { type: integer }
            sources: { type: array, items: { $ref: '#/components/schemas/AlarmAudioSource' } }
            sounds: { type: array, items: { $ref: '#/components/schemas/AlarmAudioSound' } }
    SecuritySettingsState:
