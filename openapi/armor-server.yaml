        '400': { description: 'The phrase is not acceptable (code phrase_too_short, phrase_too_long, phrase_too_common, phrase_is_example or invalid_phrase)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
        '403': { description: 'The current password is not right (code wrong_password), or an administrator has not allowed this user to have a panic phrase (code panic_not_allowed)', content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
  /api/v1/account:
