        acknowledged_at: { type: string, format: date-time }
        acknowledged_by: { type: string }
        cleared_at: { type: string, format: date-time }
        detail: { type: object, additionalProperties: { type: [string, number, boolean] }, description: Plain facts a person needs to act on it }
        silent: { type: boolean, enum: [true], description: A duress disarm; only an administrator sees it }
        acknowledged_unverified: { type: boolean, enum: [true] }
    AlarmSource:
      type: object
