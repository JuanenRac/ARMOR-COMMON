[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-common"
version = "0.5.0"
description = "A.R.M.O.R. shared contracts and validation"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armor_common = ["schemas/*.json"]
