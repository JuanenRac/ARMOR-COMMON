[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "armor-common"
version = "0.8.0.0"
description = "A.R.M.O.R. shared contracts and validation"
requires-python = ">=3.11"

[project.optional-dependencies]
contract-tests = ["pyyaml>=6", "openapi-spec-validator>=0.7", "jsonschema>=4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
armor_common = ["schemas/*.json", "battery_ops.json", "alarm_codes.json"]
