name: Fuzz the firmware parsers

on:
  push:
    paths:
      - "firmware_base/core/**"
      - "fuzz/**"
      - ".github/workflows/fuzz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: libFuzzer on the JSON parser, the Bluetooth framing and the Improv parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fuzz for 30 seconds per target
        run: bash fuzz/run_fuzz.sh 30
      - name: Keep what a failing input looks like
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
